<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Transaction Recording - FinApp</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed-dim": "#4de082",
                    "surface-container-high": "#232a34",
                    "surface-variant": "#2e353f",
                    "on-secondary": "#003919",
                    "on-secondary-container": "#003e1c",
                    "secondary-container": "#00b55d",
                    "on-background": "#dce3f0",
                    "on-surface": "#dce3f0",
                    "on-secondary-fixed-variant": "#005227",
                    "surface": "#0d141d",
                    "surface-container-low": "#151c25",
                    "on-primary-fixed-variant": "#3d28bf",
                    "primary-container": "#8b80ff",
                    "tertiary": "#ffb3b0",
                    "on-tertiary-container": "#5b000d",
                    "on-primary-fixed": "#150067",
                    "on-error": "#690005",
                    "on-error-container": "#ffdad6",
                    "tertiary-fixed-dim": "#ffb3b0",
                    "inverse-on-surface": "#2a313b",
                    "on-tertiary-fixed-variant": "#881d24",
                    "on-secondary-fixed": "#00210c",
                    "on-primary": "#2600a1",
                    "inverse-primary": "#5646d7",
                    "tertiary-fixed": "#ffdad8",
                    "inverse-surface": "#dce3f0",
                    "surface-dim": "#0d141d",
                    "secondary-fixed": "#6dfe9c",
                    "surface-bright": "#333a44",
                    "primary-fixed": "#e4dfff",
                    "surface-container-lowest": "#080f17",
                    "error": "#ffb4ab",
                    "on-tertiary": "#670211",
                    "surface-tint": "#c5c0ff",
                    "outline-variant": "#474554",
                    "surface-container": "#192029",
                    "secondary": "#4de082",
                    "surface-container-highest": "#2e353f",
                    "tertiary-container": "#ea6767",
                    "background": "#0d141d",
                    "error-container": "#93000a",
                    "primary": "#c5c0ff",
                    "outline": "#928fa0",
                    "on-surface-variant": "#c8c4d7",
                    "on-primary-container": "#20008e",
                    "on-tertiary-fixed": "#410006",
                    "primary-fixed-dim": "#c5c0ff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "8px",
                    "stack-md": "12px",
                    "container-margin": "20px",
                    "gutter-md": "16px",
                    "stack-lg": "24px",
                    "stack-sm": "4px"
            },
            "fontFamily": {
                    "headline-lg": ["Inter"],
                    "headline-md": ["Inter"],
                    "label-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "label-sm": ["Inter"],
                    "display-lg": ["Inter"],
                    "body-sm": ["Inter"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                    "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0d141d;
            color: #dce3f0;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(26, 26, 36, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .input-glow:focus-within {
            border-color: #7C6FFF;
            box-shadow: 0 0 0 2px rgba(124, 111, 255, 0.2);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md text-body-md overflow-x-hidden">
<!-- Header (Close Action) -->
<header class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md flex items-center justify-between px-container-margin h-16 border-b border-white/10">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant/50 transition-colors duration-200">
<span class="material-symbols-outlined text-on-surface" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">New Expense</h1>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<main class="mt-16 pb-32 px-container-margin max-w-xl mx-auto">
<!-- Amount Input Section -->
<section class="py-stack-lg flex flex-col items-center">
<div class="w-full text-center mb-stack-md">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Transaction Amount</span>
</div>
<div class="flex items-center justify-center gap-2 mb-stack-sm">
<input autofocus="" class="bg-transparent border-none text-center font-display-lg text-display-lg text-on-surface w-full focus:ring-0 placeholder-on-surface-variant/30" placeholder="0" type="number"/>
<div class="flex flex-col items-start">
<select class="bg-surface-container-high text-primary font-headline-md text-headline-md border-none rounded-lg py-1 px-2 focus:ring-0 appearance-none cursor-pointer">
<option value="HUF">HUF</option>
<option value="EUR">EUR</option>
<option value="USD">USD</option>
<option value="BGN">BGN</option>
</select>
</div>
</div>
<!-- Exchange Rate Display -->
<div class="bg-surface-container-low px-4 py-1.5 rounded-full border border-white/5 flex items-center gap-2">
<span class="material-symbols-outlined text-[16px] text-secondary" data-icon="currency_exchange">currency_exchange</span>
<p class="font-label-sm text-label-sm text-on-surface-variant">1 EUR = 395.5 HUF</p>
</div>
</section>
<!-- Form Section -->
<div class="space-y-stack-lg">
<!-- Quick Selection Grid -->
<div class="grid grid-cols-2 gap-gutter-md">
<!-- Account Select -->
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Account</label>
<div class="relative group">
<select class="w-full h-14 bg-surface-container border border-white/10 rounded-xl px-4 font-body-md text-on-surface appearance-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all">
<option>Main Wallet</option>
<option>Savings Vault</option>
<option>Daily Expenses</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Category Select -->
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Category</label>
<div class="relative group">
<select class="w-full h-14 bg-surface-container border border-white/10 rounded-xl px-4 font-body-md text-on-surface appearance-none focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all">
<option>Groceries</option>
<option>Transport</option>
<option>Entertainment</option>
<option>Services</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-4 text-on-surface-variant pointer-events-none" data-icon="category">category</span>
</div>
</div>
</div>
<!-- Note Field -->
<div class="space-y-stack-sm">
<label class="font-label-md text-label-md text-on-surface-variant ml-1">Note / Description</label>
<div class="relative">
<textarea class="w-full bg-surface-container border border-white/10 rounded-xl px-4 py-3 font-body-md text-on-surface focus:border-primary focus:ring-1 focus:ring-primary/20 transition-all resize-none" placeholder="What was this for?" rows="3"></textarea>
</div>
</div>
<!-- Toggles (Business & Pocket) -->
<div class="space-y-stack-md">
<!-- VitaSteps Toggle -->
<div class="flex items-center justify-between p-4 bg-surface-container border-l-4 border-primary rounded-xl">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary" data-icon="business_center">business_center</span>
</div>
<div>
<p class="font-body-md font-bold text-on-surface">Business Transaction</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">VitaSteps tracking active</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
<!-- Virtual Pocket Toggle -->
<div class="flex items-center justify-between p-4 bg-surface-container border border-white/10 rounded-xl">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full bg-secondary/10 flex items-center justify-center">
<span class="material-symbols-outlined text-secondary" data-icon="pocket">wallet</span>
</div>
<div>
<p class="font-body-md font-bold text-on-surface">Virtual Pocket</p>
<p class="font-label-sm text-label-sm text-on-surface-variant">Assign to budget pocket</p>
</div>
</div>
<label class="relative inline-flex items-center cursor-pointer">
<input class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-secondary"></div>
</label>
</div>
</div>
</div>
</main>
<!-- Fixed Save Button -->
<footer class="fixed bottom-0 w-full px-container-margin pb-safe pt-6 bg-gradient-to-t from-background via-background/90 to-transparent">
<div class="max-w-xl mx-auto mb-8">
<button class="w-full h-16 bg-primary-container text-on-primary-container font-headline-md text-headline-md rounded-xl shadow-lg active:scale-[0.98] transition-transform duration-150 flex items-center justify-center gap-3">
<span class="material-symbols-outlined" data-icon="save">save</span>
                Save Transaction
            </button>
</div>
</footer>
<!-- Background Decoration -->
<div class="fixed top-[-10%] right-[-10%] w-[60%] h-[40%] bg-primary/10 blur-[120px] rounded-full -z-10"></div>
<div class="fixed bottom-[-5%] left-[-5%] w-[40%] h-[30%] bg-secondary/5 blur-[100px] rounded-full -z-10"></div>
</body></html>
