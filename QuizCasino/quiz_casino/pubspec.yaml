name: quiz_casino
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  audioplayers: ^6.6.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  html_unescape: ^2.0.0
  http: ^1.6.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.3
  socket_io_client: ^3.1.4
  url_launcher: ^6.3.1
  dio: ^5.7.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/knowcoin.png"
  adaptive_icon_background: "#0D0D1A"
  adaptive_icon_foreground: "assets/knowcoin.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0D0D1A"
  image: assets/knowcoin.png
  android_12:
    image: assets/knowcoin.png
    color: "#0D0D1A"
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/knowcoin.png
