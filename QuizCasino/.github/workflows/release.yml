name: Build and Release APK

on:
  push:
    tags:
      - 'v*' # Például: v1.0.1, v1.1.0

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4' # Használjuk a te verziódat

      - name: Install dependencies
        run: |
          cd quiz_casino
          flutter pub get

      - name: Build APK
        run: |
          cd quiz_casino
          flutter build apk --release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: quiz_casino/build/app/outputs/flutter-apk/app-release.apk
          name: Release ${{ github.ref_name }}
          body: |
            Automated build for version ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
