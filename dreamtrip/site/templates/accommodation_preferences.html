<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferencia Beállítások - Accommodation Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #235B2A 0%, #1a4520 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #235B2A;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .progress-container {
            background: #e0e0e0;
            height: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #235B2A, #90DC25);
            height: 100%;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .section {
            background: #f8f9fa;
            border-left: 4px solid #90DC25;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .section h3 {
            color: #235B2A;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .input-group input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
        }

        .input-group.disabled {
            opacity: 0.3;
            pointer-events: none;
            filter: grayscale(1);
            transition: all 0.3s;
        }

        .explanation {
            background: #e8f5e9;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #2e7d32;
            line-height: 1.5;
            min-height: 50px;
            display: flex;
            align-items: center;
        }

        .btn-calculate {
            background: #235B2A;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-calculate:hover:not(:disabled) {
            background: #32853d;
            transform: translateY(-2px);
        }

        .btn-calculate:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>⚙️ Kritériumok finomhangolása</h1>
        <p class="subtitle">{{ stay_count }} szűrt szálláshely - állítsd be, hogyan értékeljük őket</p>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar" style="width: 80%"></div>
        </div>
        <div class="progress-text">Folyamat: Preferencia függvények beállítása</div>

        <div id="criteriaList">
            <!-- Price -->
            <div class="section">
                <h3>💰 Ár érzékenység</h3>
                <select id="price_type">
                    <option value="usual" selected>Szigorú - Bármilyen árkülönbség számít</option>
                    <option value="v-shape">Folyamatos - Minél nagyobb a különbség, annál fontosabb</option>
                    <option value="linear">Toleráns - Egy határon túl kezd el számítani</option>
                </select>
                <div class="input-group">
                    <label id="price_q_label">Ameddig nem számít (Ft)</label>
                    <input type="number" id="price_q" value="0">
                </div>
                <div class="input-group">
                    <label id="price_p_label">Mekkora különbség már maximális (Ft)</label>
                    <input type="number" id="price_p" value="10000">
                </div>
            </div>

            <!-- Rating -->
            <div class="section">
                <h3>star Értékelés (0-100)</h3>
                <select id="rating_type">
                    <option value="usual">Szigorú - Bármilyen pontkülönbség számít</option>
                    <option value="v-shape" selected>Folyamatos - Minél magasabb, annál jobb</option>
                    <option value="linear">Toleráns - Csak jelentős különbség számít</option>
                </select>
                <div class="input-group">
                    <label id="rating_q_label">Ameddig nem számít (pont)</label>
                    <input type="number" id="rating_q" value="5">
                </div>
                <div class="input-group">
                    <label id="rating_p_label">Mekkora előny már maximális (pont)</label>
                    <input type="number" id="rating_p" value="20">
                </div>
            </div>

            <!-- Reviews -->
            <div class="section">
                <h3>💬 Népszerűség (Vélemények száma)</h3>
                <select id="reviews_type">
                    <option value="v-shape" selected>Fokozatosan fontosabb a több vélemény</option>
                    <option value="u-shape">Csak egy bizonyos küszöb felett számít</option>
                </select>
                <div class="input-group">
                    <label>Küszöb (db)</label>
                    <input type="number" id="reviews_q" value="10">
                </div>
                <div class="input-group">
                    <label>Maximum előny (db)</label>
                    <input type="number" id="reviews_p" value="100">
                </div>
            </div>

            <!-- Distance -->
            <div class="section">
                <h3>📍 Távolság a belvárostól</h3>
                <select id="distance_type">
                    <option value="v-shape" selected>Folyamatosan rosszabb, ha messzebb van</option>
                    <option value="usual">Csak akkor jobb, ha közelebb van</option>
                </select>
                <div class="input-group">
                    <label>Ameddig nem távolság (km)</label>
                    <input type="number" id="distance_q" value="0.5" step="0.1">
                </div>
                <div class="input-group">
                    <label>Amitől már túl messze van (km)</label>
                    <input type="number" id="distance_p" value="5" step="0.5">
                </div>
            </div>

            <!-- Instant -->
            <div class="section">
                <h3>⚡ Azonnali foglalás</h3>
                <select id="instant_type">
                    <option value="usual" selected>Az azonnali foglalás határozott előny</option>
                </select>
                <div class="input-group disabled">
                    <label>Paraméter</label>
                    <input type="number" id="instant_q" value="0" disabled>
                    <input type="number" id="instant_p" value="0" disabled>
                </div>
            </div>
        </div>

        <div style="display: flex; gap: 15px; margin-top: 30px;">
            <button class="btn-calculate" onclick="window.location.href='/accommodation-intelligence-ahp'"
                style="background: #666; flex: 1;">⬅️ Vissza</button>
            <button id="calcBtn" onclick="calculate()" class="btn-calculate" style="flex: 2;">Rangsorolás indítása
                ➔</button>
        </div>
    </div>

    <script>
        const criteria = ['price', 'rating', 'reviews', 'distance', 'instant'];

        function updateUI() {
            criteria.forEach(c => {
                const type = document.getElementById(c + '_type').value;
                const qInput = document.getElementById(c + '_q');
                const pInput = document.getElementById(c + '_p');

                if (type === 'usual') {
                    if (qInput) qInput.closest('.input-group').classList.add('disabled');
                    if (pInput) pInput.closest('.input-group').classList.add('disabled');
                } else if (type === 'v-shape') {
                    if (qInput) qInput.closest('.input-group').classList.add('disabled');
                    if (pInput) pInput.closest('.input-group').classList.remove('disabled');
                } else {
                    if (qInput) qInput.closest('.input-group').classList.remove('disabled');
                    if (pInput) pInput.closest('.input-group').classList.remove('disabled');
                }
            });
        }

        criteria.forEach(c => {
            document.getElementById(c + '_type').addEventListener('change', updateUI);
        });

        async function calculate() {
            const btn = document.getElementById('calcBtn');
            btn.disabled = true;
            btn.innerText = "⏳ Számítás...";

            const configs = {};
            criteria.forEach(c => {
                configs[c] = {
                    type: document.getElementById(c + '_type').value,
                    q: parseFloat(document.getElementById(c + '_q').value) || 0,
                    p: parseFloat(document.getElementById(c + '_p').value) || 0
                };
            });

            const response = await fetch('/api/calculate-stay-results', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ configs })
            });

            if (response.ok) {
                window.location.href = '/accommodation-intelligence-results';
            } else {
                alert("Hiba történt a számítás során.");
                btn.disabled = false;
                btn.innerText = "Rangsorolás indítása ➔";
            }
        }

        updateUI();
    </script>
</body>

</html>
