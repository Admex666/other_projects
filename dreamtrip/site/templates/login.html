<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optivoya - Bejelentkezés</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #235B2A 0%, #1a4520 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: #235B2A;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .logo::before {
            content: '';
            width: 30px;
            height: 30px;
            background: #D4D4D6;
            border-radius: 4px;
            position: relative;
            z-index: 1;
        }

        .logo::after {
            content: '';
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 40px;
            background: linear-gradient(180deg, #90DC25 0%, transparent 100%);
            opacity: 0.9;
            z-index: 2;
        }

        h1 {
            color: #235B2A;
            font-weight: 700;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .tagline {
            color: #666;
            font-size: 14px;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            color: #333;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #D4D4D6;
            border-radius: 10px;
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #90DC25;
            box-shadow: 0 0 0 3px rgba(144, 220, 37, 0.1);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: #235B2A;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Poppins', sans-serif;
        }

        .btn:hover {
            background: #90DC25;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(144, 220, 37, 0.3);
        }

        .error {
            background: #ffe6e6;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>
    <div class="login-container">
        <img src="/static/logo.png" alt="Optivoya" style="width: 80px; margin-bottom: 20px;">
        <h1>Optivoya</h1>
        <div style="margin-top: -5px; margin-bottom: 25px;">
            <span
                style="background: #e8f5e9; color: #235B2A; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 20px; text-transform: uppercase; border: 1px solid rgba(35, 91, 42, 0.1); letter-spacing: 1px;">Early
                Access MVP</span>
        </div>
        <p class="tagline">Turning Travel Data into Decisions</p>

        {% if request.query_params.get('error') == 'invalid' %}
        <div class="error">❌ Helytelen felhasználónév vagy jelszó</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Felhasználónév</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Jelszó</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button type="submit" class="btn">Bejelentkezés</button>
        </form>
    </div>
</body>

</html>
