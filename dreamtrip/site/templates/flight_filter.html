<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szűrés - Flight Intelligence</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #235B2A;
            margin-left: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-btn {
            background: #235B2A;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #90DC25;
        }

        body {
            background: linear-gradient(135deg, #235B2A 0%, #1a4520 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #235B2A;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .filter-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .filter-section h3 {
            color: #235B2A;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
            color: #555;
        }

        input[type="text"],
        input[type="date"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .time-range {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .time-range input {
            flex: 1;
        }

        .day-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .day-btn {
            padding: 8px 16px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }

        .day-btn.active {
            background: #235B2A;
            color: white;
            border-color: #235B2A;
        }

        .btn-primary {
            background: #235B2A;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-primary:hover {
            background: #32853d;
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .status-running {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-done {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .loading-bar-container {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #235B2A, #90DC25);
            border-radius: 5px;
            animation: progressIndeterminate 2s infinite linear;
        }

        @keyframes progressIndeterminate {
            0% {
                width: 0%;
                margin-left: 0;
            }

            50% {
                width: 70%;
                margin-left: 15%;
            }

            100% {
                width: 100%;
                margin-left: 100%;
            }
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 24px;
            }

            .input-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .filter-section {
                padding: 15px;
            }

            .btn-primary {
                padding: 12px 20px;
                font-size: 14px;
            }

            .time-range span {
                margin: 0 5px;
            }

            .day-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
    <div class="navbar">
        <a href="/home" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
            <img src="/static/logo.png" alt="Optivoya" style="height: 40px;">
            <span class="logo-text">Optivoya</span>
        </a>
        <div class="user-info">
            <span style="color: #666;">👤 {{ user }}</span>
            <a href="/logout" class="logout-btn">Kilépés</a>
        </div>
    </div>
    <div class="container">
        <h1>🔍 Járatok szűrése</h1>
        <p class="subtitle">Állítsd be a preferenciáidat - jelenleg <strong>{{ flight_count }}</strong> járatkombináció
            közül választhatsz</p>

        <!-- Időkorlátok -->
        <div class="filter-section">
            <h3>⏰ Indulási időpontok</h3>
            <div class="input-grid">
                <div class="input-group">
                    <label>Odaút indulási idő (0-23 óra között)</label>
                    <div class="time-range">
                        <input type="number" id="out_time_min" min="0" max="23" value="0" placeholder="Pl. 8">
                        <span>—</span>
                        <input type="number" id="out_time_max" min="0" max="23" value="23" placeholder="Pl. 20">
                    </div>
                </div>
                <div class="input-group">
                    <label>Visszaút indulási idő</label>
                    <div class="time-range">
                        <input type="number" id="in_time_min" min="0" max="23" value="0">
                        <span>—</span>
                        <input type="number" id="in_time_max" min="0" max="23" value="23">
                    </div>
                </div>
            </div>
        </div>

        <!-- Napok -->
        <div class="filter-section">
            <h3>📅 Indulási napok</h3>
            <div class="input-group" style="margin-bottom: 15px;">
                <label>Odaút mely napokon? (kattints a kiválasztáshoz)</label>
                <div class="day-selector" id="out_days">
                    <button class="day-btn" data-day="monday">H</button>
                    <button class="day-btn" data-day="tuesday">K</button>
                    <button class="day-btn" data-day="wednesday">Sze</button>
                    <button class="day-btn" data-day="thursday">Cs</button>
                    <button class="day-btn" data-day="friday">P</button>
                    <button class="day-btn" data-day="saturday">Szo</button>
                    <button class="day-btn" data-day="sunday">V</button>
                </div>
            </div>
            <div class="input-group">
                <label>Visszaút mely napokon?</label>
                <div class="day-selector" id="in_days">
                    <button class="day-btn" data-day="monday">H</button>
                    <button class="day-btn" data-day="tuesday">K</button>
                    <button class="day-btn" data-day="wednesday">Sze</button>
                    <button class="day-btn" data-day="thursday">Cs</button>
                    <button class="day-btn" data-day="friday">P</button>
                    <button class="day-btn" data-day="saturday">Szo</button>
                    <button class="day-btn" data-day="sunday">V</button>
                </div>
            </div>
        </div>

        <!-- További szűrők -->
        <div class="filter-section">
            <h3>🎯 További kritériumok</h3>
            <div class="input-grid">
                <div class="input-group">
                    <label>Max átszállások száma</label>
                    <input type="number" id="max_stops" min="0" max="5" value="2">
                </div>
                <div class="input-group">
                    <label>Tartózkodási napok (min-max)</label>
                    <div class="time-range">
                        <input type="number" id="stay_min" min="1" value="2">
                        <span>—</span>
                        <input type="number" id="stay_max" min="1" value="14">
                    </div>
                </div>
                <div class="input-group">
                    <label>Ár intervallum (Ft)</label>
                    <div class="time-range">
                        <input type="number" id="price_min" value="0" step="1000">
                        <span>—</span>
                        <input type="number" id="price_max" value="500000" step="1000">
                    </div>
                </div>
                <div class="input-group">
                    <label>Max össz-utazási idő (óra, oda+vissza)</label>
                    <input type="number" id="max_total_duration" min="1" max="48" value="24" step="0.5">
                </div>
            </div>
        </div>

        <button class="btn-primary" id="filterBtn" onclick="applyFilters()">
            Szűrés és tovább az értékeléshez
        </button>

        <div id="status">
            <div id="statusText"></div>
            <div class="loading-bar-container" id="loadingBar">
                <div class="loading-bar"></div>
            </div>
        </div>
    </div>

    <script>
        // Napok toggle
        document.querySelectorAll('.day-btn').forEach(btn => {
            btn.addEventListener('click', function (e) {
                e.preventDefault();
                this.classList.toggle('active');
            });
        });

        let pollInterval;

        async function applyFilters() {
            const btn = document.getElementById('filterBtn');
            const statusDiv = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const loadingBar = document.getElementById('loadingBar');
            const loadingBarInner = loadingBar.querySelector('.loading-bar');

            // Napok összegyűjtése
            const outDays = Array.from(document.querySelectorAll('#out_days .day-btn.active'))
                .map(btn => btn.dataset.day);
            const inDays = Array.from(document.querySelectorAll('#in_days .day-btn.active'))
                .map(btn => btn.dataset.day);

            const payload = {
                // ❌ NE küldj origin/destination/dátum adatokat
                out_time_min: parseInt(document.getElementById('out_time_min').value),
                out_time_max: parseInt(document.getElementById('out_time_max').value),
                in_time_min: parseInt(document.getElementById('in_time_min').value),
                in_time_max: parseInt(document.getElementById('in_time_max').value),
                out_days: outDays,
                in_days: inDays,
                max_stops: parseInt(document.getElementById('max_stops').value),
                price_min: parseFloat(document.getElementById('price_min').value),
                price_max: parseFloat(document.getElementById('price_max').value),
                stay_min: parseInt(document.getElementById('stay_min').value),
                stay_max: parseInt(document.getElementById('stay_max').value),
                max_total_duration: parseFloat(document.getElementById('max_total_duration').value)
            };

            btn.disabled = true;
            statusDiv.style.display = 'block';
            statusDiv.className = 'status-running';
            statusText.innerText = "🔍 Szűrés előkészítése...";

            loadingBar.style.display = 'block';
            loadingBarInner.style.width = '0%';
            loadingBarInner.style.animation = 'none';

            await fetch('/api/apply-filters', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            pollInterval = setInterval(checkFilterStatus, 500);
        }

        async function checkFilterStatus() {
            const response = await fetch('/api/filter-status/{{ user }}');
            const data = await response.json();
            const statusDiv = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const loadingBar = document.getElementById('loadingBar');
            const loadingBarInner = loadingBar.querySelector('.loading-bar');

            if (data.status === 'running') {
                statusText.innerText = data.status_text || "⏳ Adatok feldolgozása...";
                if (data.progress !== undefined) {
                    loadingBarInner.style.width = data.progress + "%";
                }
            } else if (data.status === 'done') {
                clearInterval(pollInterval);
                loadingBarInner.style.width = "100%";
                statusDiv.className = 'status-done';
                statusText.innerText = `✅ ${data.count} járat megfelel a kritériumoknak! Átirányítás...`;

                setTimeout(() => {
                    window.location.href = '/flight-intelligence-ahp';
                }, 1000);
            } else if (data.status === 'error') {
                clearInterval(pollInterval);
                loadingBar.style.display = 'none';
                statusDiv.className = 'status-error';
                statusText.innerText = "❌ Hiba: " + data.error;
                document.getElementById('filterBtn').disabled = false;
            }
        }
    </script>
</body>

</html>
