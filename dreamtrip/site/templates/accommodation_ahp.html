<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Személyes preferenciák - Accommodation Intelligence</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #235B2A 0%, #1a4520 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #235B2A;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .progress-container {
            background: #e0e0e0;
            height: 12px;
            border-radius: 10px;
            margin-bottom: 40px;
            overflow: hidden;
        }

        .progress-bar {
            background: linear-gradient(90deg, #235B2A, #90DC25);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        .progress-text {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 10px;
        }

        .question-card {
            background: #f8f9fa;
            border-left: 4px solid #90DC25;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .question-title {
            font-size: 20px;
            font-weight: 600;
            color: #235B2A;
            margin-bottom: 25px;
            text-align: center;
        }

        .comparison-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .criterion-btn {
            flex: 1;
            padding: 20px;
            border: 3px solid #ddd;
            background: white;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: #333;
        }

        .criterion-btn:hover {
            border-color: #90DC25;
            transform: translateY(-3px);
        }

        .criterion-btn.selected {
            background: #235B2A;
            color: white;
            border-color: #235B2A;
        }

        .equal-btn {
            flex: 0.6;
            padding: 20px;
            border: 3px solid #ddd;
            background: #f0f0f0;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .equal-btn:hover {
            border-color: #666;
        }

        .equal-btn.selected {
            background: #666;
            color: white;
            border-color: #666;
        }

        .slider-container {
            margin-top: 30px;
            padding: 20px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            display: none;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .slider-label {
            font-size: 16px;
            font-weight: 600;
            color: #235B2A;
        }

        .slider-value-desc {
            font-size: 14px;
            color: #666;
            font-style: italic;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #235B2A;
            cursor: pointer;
            border: 3px solid #90DC25;
        }

        .btn-next {
            background: #235B2A;
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-next:hover:not(:disabled) {
            background: #32853d;
        }

        .btn-next:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #results {
            display: none;
            background: #f0f7f0;
            border: 2px solid #235B2A;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
        }

        .weights-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .weights-table th,
        .weights-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .weight-bar {
            background: #e0e0e0;
            height: 20px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .weight-fill {
            background: linear-gradient(90deg, #235B2A, #90DC25);
            height: 100%;
            transition: width 0.5s;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            .comparison-buttons {
                flex-direction: column;
            }

            .criterion-btn,
            .equal-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎯 Szállás preferenciák beállítása</h1>
        <p class="subtitle">Melyik szempont fontosabb számodra a választásnál?</p>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-text" id="progressText">Folyamat: 1 / 10</div>

        <div id="questionContainer" class="question-card"></div>

        <button class="btn-next" id="nextBtn" onclick="nextQuestion()" disabled>Következő kérdés</button>

        <div id="results">
            <h2 style="color: #235B2A; margin-bottom: 20px;">✅ Fontossági súlyok számítva!</h2>
            <table class="weights-table">
                <thead>
                    <tr>
                        <th>Szempont</th>
                        <th>Fontosság</th>
                    </tr>
                </thead>
                <tbody id="weightsTable"></tbody>
            </table>
            <div style="display: flex; gap: 15px; margin-top: 30px; flex-wrap: wrap;">
                <button class="btn-next" onclick="window.location.href='/accommodation-intelligence-filter'"
                    style="background: #666; flex: 1; min-width: 200px;">⬅️ Vissza a szűréshez</button>
                <button class="btn-next" onclick="window.location.href='/accommodation-intelligence-preferences'"
                    style="flex: 2; min-width: 200px;">Tovább a kritériumok finomhangolásához →</button>
            </div>
        </div>
    </div>

    <script>
        const criteria = [
            { id: "price", human: "Olcsó ár" },
            { id: "rating", human: "Kiváló értékelés" },
            { id: "reviews", human: "Népszerűség (sok vélemény)" },
            { id: "distance", human: "Városközponthoz való közelség" }
        ];

        const pairs = [];
        for (let i = 0; i < criteria.length; i++) {
            for (let j = i + 1; j < criteria.length; j++) {
                pairs.push([criteria[i], criteria[j]]);
            }
        }

        let currentIdx = 0;
        let answers = [];

        function renderQuestion() {
            const [c1, c2] = pairs[currentIdx];
            const cont = document.getElementById('questionContainer');
            cont.innerHTML = `
                <div class="question-title">Melyik fontosabb?</div>
                <div class="comparison-buttons">
                    <button class="criterion-btn" id="btn_c1" onclick="select(1)">${c1.human}</button>
                    <button class="equal-btn" id="btn_equal" onclick="select(0)">Egyforma</button>
                    <button class="criterion-btn" id="btn_c2" onclick="select(2)">${c2.human}</button>
                </div>
                <div class="slider-container" id="sliderCont">
                    <div class="slider-header">
                        <span class="slider-label">Mennyivel fontosabb?</span>
                        <span class="slider-value-desc" id="sliderDesc">Kicsit fontosabb</span>
                    </div>
                    <input type="range" id="importanceSlider" min="2" max="9" value="3" step="1" oninput="updateDesc(this.value)">
                </div>
            `;

            const progress = (currentIdx / pairs.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            document.getElementById('progressText').innerText = `Kérdés ${currentIdx + 1} / ${pairs.length}`;
            document.getElementById('nextBtn').disabled = true;
        }

        const labels = { 2: "Alig", 3: "Kicsit", 4: "Mérsékelten", 5: "Jelentősen", 6: "Erősen", 7: "Sokkal", 8: "Nagyon sokkal", 9: "Meghatározóan" };
        function updateDesc(v) { document.getElementById('sliderDesc').innerText = labels[v] + " fontosabb"; }

        function select(choice) {
            document.querySelectorAll('.criterion-btn, .equal-btn').forEach(b => b.classList.remove('selected'));
            const btn = (choice === 0) ? 'btn_equal' : (choice === 1 ? 'btn_c1' : 'btn_c2');
            document.getElementById(btn).classList.add('selected');

            const slider = document.getElementById('sliderCont');
            slider.style.display = (choice === 0) ? 'none' : 'block';
            document.getElementById('nextBtn').disabled = false;
        }

        function nextQuestion() {
            const btnEqual = document.getElementById('btn_equal').classList.contains('selected');
            const btnC1 = document.getElementById('btn_c1').classList.contains('selected');
            const importance = btnEqual ? 1 : parseInt(document.getElementById('importanceSlider').value);
            const winner = btnEqual ? 0 : (btnC1 ? 1 : 2);

            answers.push({ winner, importance });
            currentIdx++;

            if (currentIdx < pairs.length) {
                renderQuestion();
            } else {
                calculate();
            }
        }

        async function calculate() {
            const n = criteria.length;
            const matrix = Array(n).fill(0).map(() => Array(n).fill(1));

            pairs.forEach((pair, idx) => {
                const ans = answers[idx];
                const i = criteria.indexOf(pair[0]);
                const j = criteria.indexOf(pair[1]);
                if (ans.winner === 0) {
                    matrix[i][j] = matrix[j][i] = 1;
                } else if (ans.winner === 1) {
                    matrix[i][j] = ans.importance;
                    matrix[j][i] = 1 / ans.importance;
                } else {
                    matrix[j][i] = ans.importance;
                    matrix[i][j] = 1 / ans.importance;
                }
            });

            // Normalize
            const colSums = Array(n).fill(0);
            for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) colSums[j] += matrix[i][j];
            const weights = Array(n).fill(0);
            for (let i = 0; i < n; i++) {
                let sum = 0;
                for (let j = 0; j < n; j++) sum += (matrix[i][j] / colSums[j]);
                weights[i] = sum / n;
            }

            // Export to backend
            const weightObj = {};
            criteria.forEach((c, idx) => weightObj[c.id] = weights[idx]);

            await fetch('/api/save-stay-ahp-weights', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(weightObj)
            });

            document.getElementById('questionContainer').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
            document.getElementById('progressBar').style.width = '100%';
            document.getElementById('progressText').innerText = 'Kész!';

            const tbody = document.getElementById('weightsTable');
            const maxW = Math.max(...weights);
            criteria.forEach((c, i) => {
                const row = `<tr><td><strong>${c.human}</strong></td><td><div class="weight-bar"><div class="weight-fill" style="width:${(weights[i] / maxW) * 100}%"></div></div></td></tr>`;
                tbody.innerHTML += row;
            });
            document.getElementById('results').style.display = 'block';
        }

        renderQuestion();
    </script>
</body>

</html>
