<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szűrés - Accommodation Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #235B2A 0%, #1a4520 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #235B2A;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .filter-section {
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .filter-section h3 {
            color: #235B2A;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            font-size: 13px;
            color: #555;
        }

        input[type="number"],
        select {
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .checkbox-group input {
            width: 20px;
            height: 20px;
        }

        .btn-primary {
            background: #235B2A;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            margin-top: 20px;
        }

        .btn-primary:hover {
            background: #32853d;
        }

        .btn-primary:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .status-running {
            background: #e3f2fd;
            color: #1976d2;
        }

        .status-done {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px 15px;
            }

            .input-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🔍 Szállások szűrése</h1>
        <p class="subtitle">Szűkítsd a találatokat - jelenleg <strong>{{ stay_count }}</strong> ajánlat elérhető</p>

        <div class="filter-section">
            <h3>💰 Ár és Értékelés</h3>
            <div class="input-grid">
                <div class="input-group">
                    <label>Ár intervallum / éjszaka (Ft)</label>
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <input type="number" id="price_min" value="0" step="5000">
                        <span>—</span>
                        <input type="number" id="price_max" value="200000" step="5000">
                    </div>
                </div>
                <div class="input-group">
                    <label>Minimum értékelés (0-100)</label>
                    <input type="number" id="min_rating" min="0" max="100" value="70">
                </div>
            </div>
        </div>

        <div class="filter-section">
            <h3>✨ Szolgáltatások</h3>
            <div class="checkbox-group">
                <input type="checkbox" id="breakfast">
                <label for="breakfast" style="margin-bottom:0">Reggelivel együtt</label>
            </div>
        </div>

        <button class="btn-primary" id="filterBtn" onclick="applyFilters()">
            Szűrés és tovább az AHP súlyozáshoz
        </button>

        <div id="status"></div>
    </div>

    <script>
        let pollInterval;

        async function applyFilters() {
            const btn = document.getElementById('filterBtn');
            const statusDiv = document.getElementById('status');

            const payload = {
                price_min: parseFloat(document.getElementById('price_min').value),
                price_max: parseFloat(document.getElementById('price_max').value),
                min_rating: parseFloat(document.getElementById('min_rating').value),
                breakfast: document.getElementById('breakfast').checked,
                accommodation_types: null,
                amenities: null
            };

            btn.disabled = true;
            statusDiv.style.display = 'block';
            statusDiv.className = 'status-running';
            statusDiv.innerText = "🔍 Szűrés folyamatban...";

            await fetch('/api/apply-stay-filters', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            pollInterval = setInterval(checkFilterStatus, 3000);
        }

        async function checkFilterStatus() {
            const response = await fetch('/api/stay-filter-status/{{ user }}');
            const data = await response.json();
            const statusDiv = document.getElementById('status');

            if (data.status === 'running') {
                statusDiv.innerText = "⏳ Adatok feldolgozása...";
            } else if (data.status === 'done') {
                clearInterval(pollInterval);
                statusDiv.className = 'status-done';
                statusDiv.innerText = `✅ ${data.count} szállás maradt a szűrés után! Átirányítás...`;

                setTimeout(() => {
                    window.location.href = '/accommodation-intelligence-ahp';
                }, 2000);
            } else if (data.status === 'error') {
                clearInterval(pollInterval);
                statusDiv.className = 'status-error';
                statusDiv.innerText = "❌ Hiba: " + data.error;
                document.getElementById('filterBtn').disabled = false;
            }
        }
    </script>
</body>

</html>
