<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accommodation Intelligence - Optivoya</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #235B2A;
            margin-left: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-btn {
            background: #235B2A;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #90DC25;
        }

        :root {
            --primary: #235B2A;
            --primary-light: #32853d;
            --secondary: #f8f9fa;
            --accent: #FFD700;
            --text-main: #333;
            --text-muted: #666;
            --radius: 12px;
        }

        body {
            background: linear-gradient(135deg, #235B2A 0%, #1a4520 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text-main);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 35px;
            font-weight: 700;
        }

        .form-section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .form-section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }

        input,
        select {
            padding: 12px 15px;
            border: 2px solid #eee;
            border-radius: var(--radius);
            font-size: 14px;
            transition: 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-light);
        }

        /* Filter Grids */
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .filter-card {
            padding: 15px;
            border: 2px solid #eee;
            border-radius: var(--radius);
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .filter-card:hover {
            border-color: var(--primary-light);
            background: #f9fcf9;
        }

        .filter-card.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .filter-card i {
            width: 24px;
            height: 24px;
        }

        .filter-card span {
            font-size: 12px;
            font-weight: 500;
        }

        .btn-search {
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 40px;
            width: 100%;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(35, 91, 42, 0.3);
        }

        .btn-search:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(35, 91, 42, 0.4);
        }

        .btn-search:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #status {
            margin-top: 30px;
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            display: none;
            background: #f0f7f0;
            border: 1px solid #d4ebd4;
        }

        .loading-bar-container {
            width: 100%;
            height: 8px;
            background-color: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #235B2A, #90DC25);
            border-radius: 4px;
            transition: width 0.3s;
        }

        @media (max-width: 600px) {
            .search-grid {
                grid-template-columns: 1fr;
            }

            .filter-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="navbar">
        <a href="/home" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
            <img src="/static/logo.png" alt="Optivoya" style="height: 40px;">
            <span class="logo-text">Optivoya</span>
        </a>
        <div class="user-info">
            <span style="color: #666;">👤 {{ user }}</span>
            <a href="/logout" class="logout-btn">Kilépés</a>
        </div>
    </div>
    <div class="container">
        <h1>🏨 Accommodation Intelligence</h1>

        <!-- Alapadatok -->
        <div class="form-section">
            <div class="section-title"><i data-lucide="map-pin"></i> Úticél és Időpont</div>
            <div class="search-grid">
                <div class="input-group">
                    <label>Város</label>
                    <input type="text" id="city" placeholder="Pl: Budapest" value="Budapest">
                </div>
                <div class="input-group">
                    <label>Ország</label>
                    <input type="text" id="country" placeholder="Pl: Magyarország" value="Magyarország">
                </div>
                <div class="input-group">
                    <label>Érkezés</label>
                    <input type="date" id="start_date">
                </div>
                <div class="input-group">
                    <label>Távozás</label>
                    <input type="date" id="end_date">
                </div>
                <div class="input-group">
                    <label>Vendégek</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="adults" value="2" min="1" title="Felnőtt" style="flex:1">
                        <input type="number" id="children" value="0" min="0" title="Gyermek" style="flex:1">
                    </div>
                </div>
                <div class="input-group">
                    <label>Szobák</label>
                    <input type="number" id="rooms" value="1" min="1">
                </div>
            </div>
        </div>

        <!-- Elsődleges Szűrők -->
        <div class="form-section">
            <div class="section-title"><i data-lucide="filter"></i> Elsődleges Szűrők</div>

            <label style="display: block; margin-bottom: 10px;">Szállás típusa</label>
            <div class="filter-grid" id="type-grid">
                <div class="filter-card active" data-value="HOTEL">
                    <i data-lucide="hotel"></i>
                    <span>Hotel</span>
                </div>
                <div class="filter-card" data-value="APARTMENT">
                    <i data-lucide="home"></i>
                    <span>Apartman</span>
                </div>
                <div class="filter-card" data-value="GUEST">
                    <i data-lucide="door-open"></i>
                    <span>Vendégház</span>
                </div>
                <div class="filter-card" data-value="VR">
                    <i data-lucide="palmtree"></i>
                    <span>Nyaraló</span>
                </div>
                <div class="filter-card" data-value="HOSTEL">
                    <i data-lucide="bed"></i>
                    <span>Hostel</span>
                </div>
            </div>

            <label style="display: block; margin: 20px 0 10px;">Kiemelt kényelmi szolgáltatások</label>
            <div class="filter-grid" id="amenity-grid">
                <div class="filter-card" data-value="WIFI">
                    <i data-lucide="wifi"></i>
                    <span>Wifi</span>
                </div>
                <div class="filter-card" data-value="POOL">
                    <i data-lucide="waves"></i>
                    <span>Medence</span>
                </div>
                <div class="filter-card" data-value="PARKING">
                    <i data-lucide="car"></i>
                    <span>Parkoló</span>
                </div>
                <div class="filter-card" data-value="AC">
                    <i data-lucide="wind"></i>
                    <span>Klíma</span>
                </div>
                <div class="filter-card" data-value="KITCHEN">
                    <i data-lucide="utensils"></i>
                    <span>Konyha</span>
                </div>
            </div>

            <div class="search-grid" style="margin-top: 20px;">
                <div class="input-group">
                    <label>Maximum ár / éjszaka (Ft)</label>
                    <input type="number" id="price_max" value="500000" step="5000">
                </div>
                <div class="input-group">
                    <label>Minimum értékelés</label>
                    <select id="min_rating">
                        <option value="0">Összes</option>
                        <option value="90">9.0+ Szuper</option>
                        <option value="80">8.0+ Nagyon jó</option>
                        <option value="70">7.0+ Jó</option>
                    </select>
                </div>
            </div>
        </div>

        <button id="searchBtn" class="btn-search" onclick="startSearch()">🔍 Keresés indítása</button>

        <div id="status">
            <div id="statusText"></div>
            <div class="loading-bar-container" id="loadingBar">
                <div class="loading-bar"></div>
            </div>
        </div>
        <div id="results"></div>
    </div>

    <script>
        lucide.createIcons();

        // Date selection logic
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(today.getDate() + 1);
        const nextWeek = new Date(today);
        nextWeek.setDate(today.getDate() + 7);

        const startInput = document.getElementById('start_date');
        const endInput = document.getElementById('end_date');

        startInput.min = today.toISOString().split('T')[0];
        endInput.min = tomorrow.toISOString().split('T')[0];
        startInput.value = tomorrow.toISOString().split('T')[0];
        endInput.value = nextWeek.toISOString().split('T')[0];

        startInput.addEventListener('change', () => {
            const startDate = new Date(startInput.value);
            const minEndDate = new Date(startDate);
            minEndDate.setDate(startDate.getDate() + 1);
            endInput.min = minEndDate.toISOString().split('T')[0];
            if (endInput.value < endInput.min) endInput.value = endInput.min;
        });

        // Filter selection logic
        const selectedTypes = ['HOTEL'];
        const selectedAmenities = [];

        function setupGrid(id, list) {
            document.querySelectorAll(`#${id} .filter-card`).forEach(card => {
                card.addEventListener('click', () => {
                    const val = card.dataset.value;
                    const idx = list.indexOf(val);
                    if (idx > -1) {
                        list.splice(idx, 1);
                        card.classList.remove('active');
                    } else {
                        list.push(val);
                        card.classList.add('active');
                    }
                });
            });
        }

        setupGrid('type-grid', selectedTypes);
        setupGrid('amenity-grid', selectedAmenities);

        let pollInterval;

        async function startSearch() {
            const btn = document.getElementById('searchBtn');
            const statusDiv = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const loadingBar = document.getElementById('loadingBar');
            const resultsDiv = document.getElementById('results');

            const payload = {
                city: document.getElementById('city').value,
                country: document.getElementById('country').value,
                start_date: document.getElementById('start_date').value,
                end_date: document.getElementById('end_date').value,
                rooms: parseInt(document.getElementById('rooms').value),
                adults: parseInt(document.getElementById('adults').value),
                children: parseInt(document.getElementById('children').value),
                price_min: 0,
                price_max: parseFloat(document.getElementById('price_max').value),
                min_rating: parseFloat(document.getElementById('min_rating').value),
                accommodation_types: selectedTypes,
                amenities: selectedAmenities,
                breakfast: false
            };

            if (!payload.city || !payload.country) {
                alert("Kérlek add meg a várost és az országot!");
                return;
            }

            btn.disabled = true;
            statusDiv.style.display = 'block';
            statusText.innerText = "🔍 Keresés indítása...";
            loadingBar.style.display = 'block';
            loadingBar.querySelector('.loading-bar').style.width = "5%";
            resultsDiv.innerHTML = "";

            try {
                await fetch('/start-accommodation-search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                pollInterval = setInterval(checkStatus, 3000);
            } catch (e) {
                statusText.innerText = "❌ Hiba a szerverkapcsolatban.";
                btn.disabled = false;
            }
        }

        async function checkStatus() {
            const response = await fetch('/api/accommodation-status');
            const data = await response.json();
            const statusText = document.getElementById('statusText');
            const loadingBar = document.getElementById('loadingBar');

            if (data.status === 'running') {
                statusText.innerText = data.status_text || "⏳ Szállások gyűjtése...";
                if (data.progress) {
                    loadingBar.querySelector('.loading-bar').style.width = data.progress + "%";
                }
            } else if (data.status === 'done') {
                clearInterval(pollInterval);
                loadingBar.style.display = 'none';
                document.getElementById('status').style.background = '#e8f5e9';
                document.getElementById('searchBtn').disabled = false;

                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = `
                    <div style="background: white; border: 2px solid var(--primary); border-radius: 15px; padding: 30px; text-align: center; margin-top: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
                        <h2 style="color: var(--primary); margin-bottom: 15px;">🎉 Találtunk ${data.count} szállást!</h2>
                        <p style="margin-bottom: 25px; color: #666;">A megadott szűrők alapján a legrelevánsabb ajánlatokat gyűjtöttük össze.</p>
                        
                        <div style="display: flex; gap: 15px; justify-content: center;">
                            <button onclick="location.reload()" style="background: #f5f5f5; color: #333; border: none; padding: 12px 25px; border-radius: 30px; cursor: pointer; font-weight: 500;">Új keresés</button>
                            <button onclick="window.location.href='/accommodation-intelligence-ahp'" style="background: var(--primary); color: white; border: none; padding: 12px 40px; border-radius: 30px; cursor: pointer; font-weight: 700; font-size: 16px;">
                                Tovább az elemzéshez ➔
                            </button>
                        </div>
                    </div>
                `;
                statusText.innerText = "✅ Keresés befejezve.";
            } else if (data.status === 'error') {
                clearInterval(pollInterval);
                statusText.innerText = "❌ Hiba: " + data.error;
                document.getElementById('searchBtn').disabled = false;
            }
        }
    </script>
</body>

</html>
