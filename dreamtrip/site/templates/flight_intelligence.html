<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Intelligence - Optivoya</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #235B2A 0%, #1a4520 100%); min-height: 100vh; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h1 { color: #235B2A; text-align: center; margin-bottom: 30px; }
        
        .search-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; }
        label { font-weight: 600; margin-bottom: 5px; color: #555; }
        input { padding: 12px; border: 2px solid #ddd; border-radius: 10px; font-size: 14px; }
        
        .btn-search { background: #235B2A; color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-search:hover { background: #32853d; }
        .btn-search:disabled { background: #ccc; cursor: not-allowed; }

        #status { margin: 20px 0; padding: 15px; border-radius: 10px; text-align: center; display: none; }
        .status-running { background: #e3f2fd; color: #1976d2; border: 1px solid #bbdefb; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        th { background: #f8f9fa; padding: 12px; text-align: left; border-bottom: 2px solid #dee2e6; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .price { font-weight: 700; color: #235B2A; font-size: 16px; }
        .carrier-tag { background: #eee; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>✈️ Flight Intelligence</h1>
        
        <div class="search-grid">
            <div class="input-group">
                <label>Honnan</label>
                <input type="text" id="origin" placeholder="Pl: Budapest" value="Budapest">
            </div>
            <div class="input-group">
                <label>Hova</label>
                <input type="text" id="destination" placeholder="Pl: Barcelona">
            </div>
            <div class="input-group">
                <label>Odaút (ettől - eddig)</label>
                <div style="display: flex; gap: 5px;">
                    <input type="date" id="out_from">
                    <input type="date" id="out_to">
                </div>
            </div>
            <div class="input-group">
                <label>Visszaút (ettől - eddig)</label>
                <div style="display: flex; gap: 5px;">
                    <input type="date" id="in_from">
                    <input type="date" id="in_to">
                </div>
            </div>
        </div>
        
        <div class="search-grid">
        </div>
    
    <button id="searchBtn" class="btn-search" onclick="startSearch()">Járatok keresése</button>
    
    <div id="status"></div>

    <div id="results"></div>
    </div>

    <script>
        let pollInterval;

        async function startSearch() {
            const btn = document.getElementById('searchBtn');
            const statusDiv = document.getElementById('status');
            const resultsDiv = document.getElementById('results');
            
            const payload = {
                origin: document.getElementById('origin').value,
                destination: document.getElementById('destination').value,
                out_from: document.getElementById('out_from').value,
                out_to: document.getElementById('out_to').value,
                in_from: document.getElementById('in_from').value,
                in_to: document.getElementById('in_to').value
            };

            if(!payload.destination || !payload.out_from) {
                alert("Kérlek töltsd ki a célállomást és a dátumokat!");
                return;
            }

            btn.disabled = true;
            statusDiv.style.display = 'block';
            statusDiv.className = 'status-running';
            statusDiv.innerText = "🔍 Keresés indítása... (ez 1-2 percig is eltarthat)";
            resultsDiv.innerHTML = "";

            await fetch('/start-intelligence-search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            pollInterval = setInterval(checkStatus, 3000);
        }

        async function checkStatus() {
            const response = await fetch('/search-status');
            const data = await response.json();
            const statusDiv = document.getElementById('status');

            if (data.status === 'running') {
                statusDiv.innerText = "⏳ Adatok gyűjtése és elemzése folyamatban...";
            } else if (data.status === 'done') {
                clearInterval(pollInterval);
                statusDiv.style.display = 'none';
                document.getElementById('searchBtn').disabled = false;
                
                // Sikeres összesítő megjelenítése
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = `
                    <div style="background: #f0f7f0; border: 2px solid #235B2A; border-radius: 15px; padding: 30px; text-align: center; margin-top: 20px;">
                        <h2 style="color: #235B2A; margin-bottom: 10px;">✅ Sikeres adatgyűjtés!</h2>
                        <p style="font-size: 18px; margin-bottom: 20px;">Összesen <strong>${data.count}</strong> lehetséges járatkombinációt találtunk.</p>
                        
                        <div style="display: flex; gap: 10px; justify-content: center;">
                            <button onclick="window.location.href='/flight-intelligence'" class="btn-search" style="background: #666; width: auto; padding: 12px 25px;">Új keresés</button>
                            <button onclick="window.location.href='/flight-intelligence-filter'" class="btn-search" style="width: auto; padding: 12px 40px; font-size: 18px;">
                                Tovább a preferenciák beállításához ➔
                            </button>
                        </div>
                    </div>
                `;
            } else if (data.status === 'error') {
                clearInterval(pollInterval);
                statusDiv.innerText = "❌ Hiba történt: " + data.error;
                document.getElementById('searchBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
