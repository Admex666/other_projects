<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Intelligence</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 1200px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
            text-align: center;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        .btn:hover { background: #5568d3; transform: translateY(-2px); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }
        .status.running { background: #fff3cd; color: #856404; }
        .status.done { background: #d4edda; color: #155724; }
        .status.error { background: #f8d7da; color: #721c24; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #667eea;
            color: white;
            font-weight: bold;
        }
        tr:hover { background: #f5f5f5; }
        .price { font-weight: bold; color: #667eea; }
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✈️ Flight Intelligence</h1>
        
        <button class="btn" id="searchBtn" onclick="startSearch()">
            Repjegy keresés indítása
        </button>
        
        <div id="statusDiv"></div>
        <div id="resultsDiv"></div>
    </div>

    <script>
        let statusInterval;

        async function startSearch() {
            document.getElementById('searchBtn').disabled = true;
            document.getElementById('statusDiv').innerHTML = '<div class="loader"></div>';
            document.getElementById('resultsDiv').innerHTML = '';

            await fetch('/search', { method: 'POST' });

            statusInterval = setInterval(checkStatus, 2000);
        }

        async function checkStatus() {
            const res = await fetch('/status');
            const data = await res.json();

            if (data.status === 'running') {
                document.getElementById('statusDiv').innerHTML = 
                    '<div class="status running">🔄 Scraping folyamatban...</div>';
            } 
            else if (data.status === 'done') {
                clearInterval(statusInterval);
                document.getElementById('statusDiv').innerHTML = 
                    '<div class="status done">✅ Kész! ' + data.data.length + ' járat találva</div>';
                displayResults(data.data);
                document.getElementById('searchBtn').disabled = false;
            } 
            else if (data.status === 'error') {
                clearInterval(statusInterval);
                document.getElementById('statusDiv').innerHTML = 
                    '<div class="status error">❌ Hiba: ' + data.error + '</div>';
                document.getElementById('searchBtn').disabled = false;
            }
        }

        function displayResults(flights) {
            let html = '<table><thead><tr>' +
                '<th>Ár</th><th>Oda</th><th>Vissza</th><th>Tartózkodás</th><th>Átszállások</th>' +
                '</tr></thead><tbody>';

            flights.forEach(f => {
                html += `<tr>
                    <td class="price">${f.total_price_huf.toFixed(0)} Ft</td>
                    <td>${f.out_dep_time} → ${f.out_arr_time}<br><small>${f.out_carriers}</small></td>
                    <td>${f.in_dep_time} → ${f.in_arr_time}<br><small>${f.in_carriers}</small></td>
                    <td>${f.stay_days} éj</td>
                    <td>${f.total_stops}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            document.getElementById('resultsDiv').innerHTML = html;
        }
    </script>
</body>
</html>
