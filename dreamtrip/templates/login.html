<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optivoya — Bejelentkezés</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <script src="/static/js/theme.js"></script>

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background-color: var(--bg-base);
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            box-shadow: var(--shadow-xl);
        }

        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            text-align: center;
        }

        .login-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary-contrast);
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .login-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            font-size: 13.5px;
            color: var(--text-secondary);
        }

        .alert-error {
            background: var(--status-error-bg);
            color: var(--status-error);
            border: 1px solid var(--status-error);
            border-radius: var(--radius-sm);
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .theme-switch-wrap {
            position: absolute;
            top: 24px;
            right: 24px;
        }
    </style>
</head>
<body>

    <div class="theme-switch-wrap">
        <button type="button" class="theme-toggle-btn" onclick="window.toggleTheme()" aria-label="Téma váltása">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>

    <div class="login-card">
        <div class="login-brand">
            <img src="/static/logo.png" alt="Optivoya Logo" style="width: 56px; height: 56px; object-fit: contain; border-radius: var(--radius-md); box-shadow: var(--shadow-md);">
            <div>
                <h1 class="login-title">Optivoya</h1>
                <p class="login-subtitle">Intelligens utazástervezési platform</p>
            </div>
        </div>

        <script>
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('error') === 'invalid') {
                document.write(`
                    <div class="alert-error">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="12"></line>
                            <line x1="12" y1="16" x2="12.01" y2="16"></line>
                        </svg>
                        <span>Hibás felhasználónév vagy jelszó!</span>
                    </div>
                `);
            }
        </script>

        <form action="/login" method="POST">
            <div class="form-group">
                <label class="form-label" for="username">Felhasználónév</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="pl. admin" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 24px;">
                <label class="form-label" for="password">Jelszó</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="padding: 12px; font-size: 14px;">
                Bejelentkezés
            </button>
        </form>
    </div>

</body>
</html>
