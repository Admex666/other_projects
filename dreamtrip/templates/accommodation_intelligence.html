<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accommodation Intelligence - Optivoya</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #235B2A;
            margin-left: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-btn {
            background: #235B2A;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #90DC25;
        }

        :root {
            --primary: #235B2A;
            --primary-light: #32853d;
            --secondary: #f8f9fa;
            --accent: #FFD700;
            --text-main: #333;
            --text-muted: #666;
            --radius: 12px;
        }

        body {
            background: linear-gradient(135deg, #235B2A 0%, #1a4520 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: var(--text-main);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            color: var(--primary);
            text-align: center;
            margin-bottom: 35px;
            font-weight: 700;
        }

        .form-section {
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .form-section:last-child {
            border-bottom: none;
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 16px;
            border: 2px solid #e0e0e0;
            border-radius: var(--radius);
            font-size: 14px;
            transition: 0.3s;
        }

        #destination {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 500;
            border-color: #cce5cf;
            background: #fbfdfb;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.03);
        }

        #destination:focus {
            background: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(35, 91, 42, 0.12);
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary-light);
        }

        /* Filter Grids */
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
        }

        .filter-card {
            padding: 15px;
            border: 2px solid #eee;
            border-radius: var(--radius);
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .filter-card:hover {
            border-color: var(--primary-light);
            background: #f9fcf9;
        }

        .filter-card.active {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .filter-card i {
            width: 24px;
            height: 24px;
        }

        .filter-card span {
            font-size: 12px;
            font-weight: 500;
        }

        .btn-search {
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 40px;
            width: 100%;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 20px;
            box-shadow: 0 5px 15px rgba(35, 91, 42, 0.3);
        }

        .btn-search:hover {
            background: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(35, 91, 42, 0.4);
        }

        .btn-search:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #status {
            margin-top: 30px;
            padding: 20px;
            border-radius: var(--radius);
            text-align: center;
            display: none;
            background: #f0f7f0;
            border: 1px solid #d4ebd4;
        }

        .loading-bar-container {
            width: 100%;
            height: 8px;
            background-color: #eee;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #235B2A, #90DC25);
            border-radius: 4px;
            transition: width 0.3s;
        }

        /* Autocomplete dropdown styles */
        .autocomplete-container {
            position: relative;
            width: 100%;
        }

        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: var(--radius);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            max-height: 260px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .autocomplete-item {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f5f5f5;
            transition: background 0.15s ease;
            text-align: left;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover,
        .autocomplete-item.active {
            background: #f0f7f0;
        }

        .autocomplete-main {
            display: flex;
            flex-direction: column;
        }

        .autocomplete-title {
            font-weight: 600;
            color: var(--primary);
            font-size: 14px;
        }

        .autocomplete-sub {
            font-size: 11px;
            color: #777;
            margin-top: 2px;
        }

        .autocomplete-empty {
            padding: 12px 15px;
            color: #888;
            font-size: 13px;
            text-align: center;
            font-style: italic;
        }

        @media (max-width: 600px) {
            .search-grid {
                grid-template-columns: 1fr;
            }

            .filter-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="navbar">
        <a href="/home" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
            <img src="/static/logo.png" alt="Optivoya" style="height: 40px;">
            <span class="logo-text">Optivoya</span>
            <span
                style="background: #90DC25; color: #235B2A; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; margin-left: 8px; border: 1px solid rgba(144, 220, 37, 0.2); letter-spacing: 0.5px; white-space: nowrap;">Early
                Access</span>
        </a>
        <div class="user-info">
            <span style="color: #666;">👤 {{ user }}</span>
            <a href="/logout" class="logout-btn">Kilépés</a>
        </div>
    </div>
    <div class="container">
        <h1>🏨 Accommodation Intelligence</h1>

        <!-- Alapadatok -->
        <div class="form-section">
            <div class="section-title"><i data-lucide="map-pin"></i> Úticél és Időpont</div>
            <div class="search-grid">
                <div class="input-group" style="grid-column: 1 / -1;">
                    <label>📍 Úti cél (Város vagy Régió)</label>
                    <div class="autocomplete-container" id="dest-container">
                        <input type="text" id="destination" placeholder="Pl: Barcelona, Róma, Párizs vagy Budapest..."
                            value="{{ (prefill.city + ', ' + prefill.country) if (prefill.city and prefill.country) else (prefill.city or 'Barcelona, Spanyolország') }}" autocomplete="off">
                        <input type="hidden" id="selected_city" value="{{ prefill.city or 'Barcelona' }}">
                        <input type="hidden" id="selected_country" value="{{ prefill.country or 'Spanyolország' }}">
                        <div class="autocomplete-dropdown" id="dest-dropdown"></div>
                    </div>
                    <small style="color: #666; font-size: 11px; margin-top: 4px;">Kezdj el gépelni egy várost vagy úti célt a felajánlott listához.</small>
                </div>
                <div class="input-group">
                    <label>Érkezés</label>
                    <input type="date" id="start_date">
                </div>
                <div class="input-group">
                    <label>Távozás</label>
                    <input type="date" id="end_date">
                </div>
                <div class="input-group">
                    <label>Vendégek</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="number" id="adults" value="2" min="1" title="Felnőtt" style="flex:1">
                        <input type="number" id="children" value="0" min="0" title="Gyermek" style="flex:1">
                    </div>
                </div>
                <div class="input-group">
                    <label>Szobák</label>
                    <input type="number" id="rooms" value="1" min="1">
                </div>
            </div>
        </div>

        <!-- Elsődleges Szűrők -->
        <div class="form-section">
            <div class="section-title"><i data-lucide="filter"></i> Elsődleges Szűrők</div>

            <label style="display: block; margin-bottom: 10px;">Szállás típusa</label>
            <div class="filter-grid" id="type-grid">
                <div class="filter-card active" data-value="HOTEL">
                    <i data-lucide="hotel"></i>
                    <span>Hotel</span>
                </div>
                <div class="filter-card active" data-value="APARTMENT">
                    <i data-lucide="home"></i>
                    <span>Apartman</span>
                </div>
                <div class="filter-card active" data-value="GUEST">
                    <i data-lucide="door-open"></i>
                    <span>Vendégház</span>
                </div>
                <div class="filter-card active" data-value="VR">
                    <i data-lucide="palmtree"></i>
                    <span>Nyaraló</span>
                </div>
                <div class="filter-card active" data-value="HOSTEL">
                    <i data-lucide="bed"></i>
                    <span>Hostel</span>
                </div>
            </div>

            <label style="display: block; margin: 20px 0 10px 0;">Kényelmi szolgáltatások</label>
            <div class="filter-grid" id="amenity-grid">
                <div class="filter-card" data-value="WIFI">
                    <i data-lucide="wifi"></i>
                    <span>Ingyenes Wifi</span>
                </div>
                <div class="filter-card" data-value="POOL">
                    <i data-lucide="waves"></i>
                    <span>Medence</span>
                </div>
                <div class="filter-card" data-value="PARKING">
                    <i data-lucide="car"></i>
                    <span>Parkoló</span>
                </div>
                <div class="filter-card" data-value="AC">
                    <i data-lucide="wind"></i>
                    <span>Klímaberendezés</span>
                </div>
                <div class="filter-card" data-value="KITCHEN">
                    <i data-lucide="utensils"></i>
                    <span>Konyha</span>
                </div>
            </div>

            <div class="search-grid" style="margin-top: 20px;">
                <div class="input-group">
                    <label>Maximum ár / éjszaka (Ft)</label>
                    <input type="number" id="price_max" value="100000" step="5000">
                </div>
                <div class="input-group">
                    <label>Minimális értékelés (0-10)</label>
                    <input type="number" id="min_rating" value="7" min="0" max="10" step="0.5">
                </div>
            </div>
        </div>

        <button id="searchBtn" class="btn-search" onclick="startSearch()">
            Szállások keresése
        </button>

        <div id="status">
            <div id="statusText" style="font-weight: 600; color: var(--primary); margin-bottom: 10px;"></div>
            <div class="loading-bar-container" id="loadingBar">
                <div class="loading-bar"></div>
            </div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        lucide.createIcons();

        // ===== SINGLE DESTINATION AUTOCOMPLETE KONTROLLER =====
        function setupAccommodationAutocomplete() {
            const destInput = document.getElementById('destination');
            const destDropdown = document.getElementById('dest-dropdown');
            const selectedCity = document.getElementById('selected_city');
            const selectedCountry = document.getElementById('selected_country');
            let debounceTimer = null;
            let currentItems = [];
            let activeIndex = -1;

            async function fetchSuggestions(term) {
                try {
                    const res = await fetch(`/api/locations/autocomplete?term=${encodeURIComponent(term)}&mode=destination`);
                    if (!res.ok) return [];
                    return await res.json();
                } catch (e) {
                    return [];
                }
            }

            function renderDropdown(items) {
                currentItems = items;
                activeIndex = -1;
                if (!items || items.length === 0) {
                    destDropdown.innerHTML = '<div class="autocomplete-empty">Nincs találat</div>';
                    destDropdown.style.display = 'block';
                    return;
                }

                destDropdown.innerHTML = items.map((item, idx) => `
                    <div class="autocomplete-item" data-index="${idx}">
                        <div class="autocomplete-main">
                            <div class="autocomplete-title">
                                📍 ${item.city_name || item.name}
                            </div>
                            <div class="autocomplete-sub">${item.country_name || ''}</div>
                        </div>
                    </div>
                `).join('');

                destDropdown.querySelectorAll('.autocomplete-item').forEach(el => {
                    el.addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        const idx = parseInt(el.dataset.index);
                        selectItem(currentItems[idx]);
                    });
                });

                destDropdown.style.display = 'block';
            }

            function selectItem(item) {
                if (!item) return;
                const cityName = item.city_name || item.name;
                const countryName = item.country_name || '';
                destInput.value = countryName ? `${cityName}, ${countryName}` : cityName;
                selectedCity.value = cityName;
                selectedCountry.value = countryName;
                destDropdown.style.display = 'none';
            }

            destInput.addEventListener('focus', async () => {
                const items = await fetchSuggestions(destInput.value.trim());
                renderDropdown(items);
            });

            destInput.addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(async () => {
                    const items = await fetchSuggestions(destInput.value.trim());
                    renderDropdown(items);
                }, 150);
            });

            destInput.addEventListener('keydown', (e) => {
                const itemsEls = destDropdown.querySelectorAll('.autocomplete-item');
                if (destDropdown.style.display === 'block' && itemsEls.length > 0) {
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        activeIndex = (activeIndex + 1) % itemsEls.length;
                        updateActiveItem(itemsEls);
                    } else if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        activeIndex = (activeIndex - 1 + itemsEls.length) % itemsEls.length;
                        updateActiveItem(itemsEls);
                    } else if (e.key === 'Enter') {
                        if (activeIndex >= 0 && activeIndex < currentItems.length) {
                            e.preventDefault();
                            selectItem(currentItems[activeIndex]);
                        }
                    } else if (e.key === 'Escape') {
                        destDropdown.style.display = 'none';
                    }
                }
            });

            function updateActiveItem(itemsEls) {
                itemsEls.forEach((el, idx) => {
                    if (idx === activeIndex) {
                        el.classList.add('active');
                        el.scrollIntoView({ block: 'nearest' });
                    } else {
                        el.classList.remove('active');
                    }
                });
            }

            document.addEventListener('click', (e) => {
                if (!destInput.contains(e.target) && !destDropdown.contains(e.target)) {
                    destDropdown.style.display = 'none';
                }
            });
        }

        setupAccommodationAutocomplete();

        // Default dates setup
        const today = new Date();
        const nextWeek = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);
        const nextWeekEnd = new Date(today.getTime() + 11 * 24 * 60 * 60 * 1000);

        const startInput = document.getElementById('start_date');
        const endInput = document.getElementById('end_date');

        startInput.value = "{{ prefill.start_date or '' }}" || nextWeek.toISOString().split('T')[0];
        endInput.value = "{{ prefill.end_date or '' }}" || nextWeekEnd.toISOString().split('T')[0];
        startInput.min = today.toISOString().split('T')[0];
        endInput.min = startInput.value;

        startInput.addEventListener('change', () => {
            endInput.min = startInput.value;
            if (endInput.value < endInput.min) endInput.value = endInput.min;
        });

        // Filter selection logic
        const selectedTypes = ['HOTEL', 'APARTMENT', 'GUEST', 'VR', 'HOSTEL'];
        const selectedAmenities = [];

        function setupGrid(id, list) {
            document.querySelectorAll(`#${id} .filter-card`).forEach(card => {
                card.addEventListener('click', () => {
                    const val = card.dataset.value;
                    const idx = list.indexOf(val);
                    if (idx > -1) {
                        list.splice(idx, 1);
                        card.classList.remove('active');
                    } else {
                        list.push(val);
                        card.classList.add('active');
                    }
                });
            });
        }

        setupGrid('type-grid', selectedTypes);
        setupGrid('amenity-grid', selectedAmenities);

        let pollInterval;

        async function startSearch() {
            const btn = document.getElementById('searchBtn');
            const statusDiv = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const loadingBar = document.getElementById('loadingBar');
            const resultsDiv = document.getElementById('results');

            const rawDest = document.getElementById('destination').value.trim();
            const hiddenCity = document.getElementById('selected_city').value.trim();
            const hiddenCountry = document.getElementById('selected_country').value.trim();

            let cityVal = hiddenCity;
            let countryVal = hiddenCountry;

            // Ha a felhasználó átírta a szövegmezőt kézzel
            if (!rawDest) {
                alert("Kérlek adj meg egy úti célt!");
                return;
            }

            if (rawDest.includes(',')) {
                const parts = rawDest.split(',');
                cityVal = parts[0].trim();
                countryVal = parts[1].trim();
            } else if (!cityVal || !rawDest.includes(cityVal)) {
                cityVal = rawDest;
            }

            const payload = {
                city: cityVal,
                country: countryVal,
                start_date: document.getElementById('start_date').value,
                end_date: document.getElementById('end_date').value,
                rooms: parseInt(document.getElementById('rooms').value),
                adults: parseInt(document.getElementById('adults').value),
                children: parseInt(document.getElementById('children').value),
                price_min: 0,
                price_max: parseFloat(document.getElementById('price_max').value),
                min_rating: parseFloat(document.getElementById('min_rating').value),
                accommodation_types: selectedTypes,
                amenities: selectedAmenities,
                breakfast: false
            };

            if (!payload.city || !payload.country) {
                alert("Kérlek add meg a várost és az országot!");
                return;
            }

            btn.disabled = true;
            statusDiv.style.display = 'block';
            statusDiv.style.background = '#f0f7f0';
            statusText.innerText = "🔍 Keresés indítása...";
            loadingBar.style.display = 'block';
            loadingBar.querySelector('.loading-bar').style.width = "5%";
            resultsDiv.innerHTML = "";

            try {
                await fetch('/start-accommodation-search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                pollInterval = setInterval(checkStatus, 2000);
            } catch (e) {
                statusText.innerText = "❌ Hiba a szerverkapcsolatban.";
                btn.disabled = false;
            }
        }

        async function checkStatus() {
            const response = await fetch('/api/accommodation-status');
            const data = await response.json();
            const statusDiv = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const loadingBar = document.getElementById('loadingBar');

            if (data.status === 'running') {
                statusText.innerText = data.status_text || "⏳ Szállások gyűjtése...";
                if (data.progress) {
                    loadingBar.querySelector('.loading-bar').style.width = data.progress + "%";
                }
            } else if (data.status === 'done') {
                clearInterval(pollInterval);
                loadingBar.style.display = 'none';
                statusDiv.style.background = '#e8f5e9';
                document.getElementById('searchBtn').disabled = false;

                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = `
                    <div style="background: white; border: 2px solid var(--primary); border-radius: 15px; padding: 30px; text-align: center; margin-top: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);">
                        <h2 style="color: var(--primary); margin-bottom: 15px;">🎉 Találtunk ${data.count} szállást!</h2>
                        <p style="margin-bottom: 25px; color: #666;">A megadott szűrők alapján a legrelevánsabb ajánlatokat gyűjtöttük össze.</p>
                        
                        <div style="display: flex; gap: 15px; justify-content: center;">
                            <button onclick="location.reload()" style="background: #f5f5f5; color: #333; border: none; padding: 12px 25px; border-radius: 30px; cursor: pointer; font-weight: 500;">Új keresés</button>
                            <button onclick="window.location.href='/accommodation-intelligence-ahp'" style="background: var(--primary); color: white; border: none; padding: 12px 40px; border-radius: 30px; cursor: pointer; font-weight: 700; font-size: 16px;">
                                Tovább az elemzéshez ➔
                            </button>
                        </div>
                    </div>
                `;
                statusText.innerText = "✅ Keresés befejezve.";
            } else if (data.status === 'error') {
                clearInterval(pollInterval);
                loadingBar.style.display = 'none';
                statusDiv.style.background = '#ffebee';
                statusText.innerText = "❌ Hiba: " + data.error;
                document.getElementById('searchBtn').disabled = false;
            }
        }
    </script>
</body>

</html>
