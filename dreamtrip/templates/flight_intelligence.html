<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optivoya - Flight Intelligence</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #235B2A;
            margin-left: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-btn {
            background: #235B2A;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #90DC25;
        }

        body {
            background: linear-gradient(135deg, #235B2A 0%, #1a4520 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #235B2A;
            text-align: center;
            margin-bottom: 30px;
        }

        .search-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }

        input {
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }

        .btn-search {
            background: #235B2A;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 10px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-search:hover {
            background: #32853d;
        }

        .btn-search:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .status-running {
            background: #e3f2fd;
            color: #1976d2;
            border: 1px solid #bbdefb;
        }

        .loading-bar-container {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 15px;
            display: none;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #235B2A, #90DC25);
            border-radius: 5px;
            animation: progressIndeterminate 2s infinite linear;
        }

        @keyframes progressIndeterminate {
            0% {
                width: 0%;
                margin-left: 0;
            }

            50% {
                width: 70%;
                margin-left: 15%;
            }

            100% {
                width: 100%;
                margin-left: 100%;
            }
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 13px;
        }

        th {
            background: #f8f9fa;
            padding: 12px;
            text-align: left;
            border-bottom: 2px solid #dee2e6;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .price {
            font-weight: 700;
            color: #235B2A;
            font-size: 16px;
        }

        .carrier-tag {
            background: #eee;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
        }

        /* Autocomplete dropdown styles */
        .autocomplete-container {
            position: relative;
            width: 100%;
        }

        .autocomplete-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            max-height: 280px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
        }

        .autocomplete-item {
            padding: 10px 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #f5f5f5;
            transition: background 0.15s ease;
            text-align: left;
        }

        .autocomplete-item:last-child {
            border-bottom: none;
        }

        .autocomplete-item:hover,
        .autocomplete-item.active {
            background: #f0f7f0;
        }

        .autocomplete-main {
            display: flex;
            flex-direction: column;
        }

        .autocomplete-title {
            font-weight: 600;
            color: #235B2A;
            font-size: 14px;
        }

        .autocomplete-sub {
            font-size: 11px;
            color: #777;
            margin-top: 2px;
        }

        .autocomplete-badge {
            background: #eef6ec;
            color: #235B2A;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            border: 1px solid #cde4c9;
            white-space: nowrap;
        }

        .autocomplete-empty {
            padding: 12px 15px;
            color: #888;
            font-size: 13px;
            text-align: center;
            font-style: italic;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 24px;
            }

            .search-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .input-group label {
                font-size: 13px;
            }

            input {
                padding: 10px;
                font-size: 14px;
            }

            .btn-search {
                padding: 12px 20px;
                font-size: 14px;
            }

            .input-group div[style*="display: flex"] {
                flex-direction: column;
            }

            #results div {
                padding: 20px 15px !important;
            }

            #results div div {
                flex-direction: column;
            }

            #results button {
                width: 100% !important;
            }
        }
    </style>
</head>

<body>
    <div class="navbar">
        <a href="/home" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
            <img src="/static/logo.png" alt="Optivoya" style="height: 40px;">
            <span class="logo-text">Optivoya</span>
            <span
                style="background: #90DC25; color: #235B2A; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; margin-left: 8px; border: 1px solid rgba(35, 91, 42, 0.2); letter-spacing: 0.5px; white-space: nowrap;">Early
                Access</span>
        </a>
        <div class="user-info">
            <span style="color: #666;">👤 {{ user }}</span>
            <a href="/logout" class="logout-btn">Kilépés</a>
        </div>
    </div>
    <div class="container">
        <h1>✈️ Flight Intelligence</h1>

        <div class="search-grid">
            <div class="input-group">
                <label>Honnan (Indulási repülőtér / város)</label>
                <div class="autocomplete-container" id="origin-container">
                    <input type="text" id="origin" placeholder="Pl: Budapest (BUD)" value="{{ prefill.origin or 'Budapest' }}" autocomplete="off">
                    <div class="autocomplete-dropdown" id="origin-dropdown"></div>
                </div>
            </div>
            <div class="input-group">
                <label>Hova (Érkezési repülőtér / város)</label>
                <div class="autocomplete-container" id="destination-container">
                    <input type="text" id="destination" placeholder="Pl: Barcelona (BCN)" value="{{ prefill.destination or '' }}" autocomplete="off">
                    <div class="autocomplete-dropdown" id="destination-dropdown"></div>
                </div>
            </div>
            <div class="input-group">
                <label>Odaút (ettől - eddig)</label>
                <div style="display: flex; gap: 5px;">
                    <input type="date" id="out_from">
                    <input type="date" id="out_to">
                </div>
            </div>
            <div class="input-group">
                <label>Visszaút (ettől - eddig)</label>
                <div style="display: flex; gap: 5px;">
                    <input type="date" id="in_from">
                    <input type="date" id="in_to">
                </div>
            </div>
        </div>

        <script>
            // ===== AUTOCOMPLETE CONTROLLER =====
            function setupAutocomplete(inputId, dropdownId, mode) {
                const input = document.getElementById(inputId);
                const dropdown = document.getElementById(dropdownId);
                let debounceTimer = null;
                let activeIndex = -1;
                let currentItems = [];

                async function fetchSuggestions(term) {
                    try {
                        const res = await fetch(`/api/locations/autocomplete?term=${encodeURIComponent(term)}&mode=${mode}`);
                        if (!res.ok) return [];
                        return await res.json();
                    } catch (e) {
                        console.error("Autocomplete error:", e);
                        return [];
                    }
                }

                function renderDropdown(items) {
                    currentItems = items;
                    activeIndex = -1;
                    if (!items || items.length === 0) {
                        dropdown.innerHTML = '<div class="autocomplete-empty">Nincs találat repülőtérrel</div>';
                        dropdown.style.display = 'block';
                        return;
                    }

                    dropdown.innerHTML = items.map((item, idx) => `
                        <div class="autocomplete-item" data-index="${idx}">
                            <div class="autocomplete-main">
                                <div class="autocomplete-title">
                                    ${item.type === 'city' ? '🏙️' : '✈️'} ${item.city_name || item.name}
                                </div>
                                <div class="autocomplete-sub">${item.sub || item.country_name || ''}</div>
                            </div>
                            ${item.code ? `<span class="autocomplete-badge">${item.code}</span>` : ''}
                        </div>
                    `).join('');

                    dropdown.querySelectorAll('.autocomplete-item').forEach(el => {
                        el.addEventListener('mousedown', (e) => {
                            e.preventDefault();
                            const idx = parseInt(el.dataset.index);
                            selectItem(currentItems[idx]);
                        });
                    });

                    dropdown.style.display = 'block';
                }

                function selectItem(item) {
                    if (!item) return;
                    const val = item.code ? `${item.city_name || item.name} (${item.code})` : (item.city_name || item.name);
                    input.value = val;
                    input.dataset.selectedId = item.id || '';
                    dropdown.style.display = 'none';
                    activeIndex = -1;
                }

                input.addEventListener('focus', async () => {
                    const items = await fetchSuggestions(input.value.trim());
                    renderDropdown(items);
                });

                input.addEventListener('input', () => {
                    clearTimeout(debounceTimer);
                    debounceTimer = setTimeout(async () => {
                        const items = await fetchSuggestions(input.value.trim());
                        renderDropdown(items);
                    }, 150);
                });

                input.addEventListener('keydown', (e) => {
                    const itemsEls = dropdown.querySelectorAll('.autocomplete-item');
                    if (dropdown.style.display === 'block' && itemsEls.length > 0) {
                        if (e.key === 'ArrowDown') {
                            e.preventDefault();
                            activeIndex = (activeIndex + 1) % itemsEls.length;
                            updateActiveItem(itemsEls);
                        } else if (e.key === 'ArrowUp') {
                            e.preventDefault();
                            activeIndex = (activeIndex - 1 + itemsEls.length) % itemsEls.length;
                            updateActiveItem(itemsEls);
                        } else if (e.key === 'Enter') {
                            if (activeIndex >= 0 && activeIndex < currentItems.length) {
                                e.preventDefault();
                                selectItem(currentItems[activeIndex]);
                            }
                        } else if (e.key === 'Escape') {
                            dropdown.style.display = 'none';
                            activeIndex = -1;
                        }
                    }
                });

                function updateActiveItem(itemsEls) {
                    itemsEls.forEach((el, idx) => {
                        if (idx === activeIndex) {
                            el.classList.add('active');
                            el.scrollIntoView({ block: 'nearest' });
                        } else {
                            el.classList.remove('active');
                        }
                    });
                }

                document.addEventListener('click', (e) => {
                    if (!input.contains(e.target) && !dropdown.contains(e.target)) {
                        dropdown.style.display = 'none';
                    }
                });
            }

            // Autocomplete inicializálása
            setupAutocomplete('origin', 'origin-dropdown', 'origin');
            setupAutocomplete('destination', 'destination-dropdown', 'destination');
        </script>

        <script>
            const outFromInput = document.getElementById('out_from');
            const outToInput = document.getElementById('out_to');
            const inFromInput = document.getElementById('in_from');
            const inToInput = document.getElementById('in_to');

            const today = new Date().toISOString().split('T')[0];
            const tomorrow = new Date(new Date().getTime() + 24 * 60 * 60 * 1000).toISOString().split('T')[0];
            const nextWeek = new Date(new Date().getTime() + 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
            const nextWeekLater = new Date(new Date().getTime() + 10 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];

            [outFromInput, outToInput, inFromInput, inToInput].forEach(el => {
                el.min = today;
            });

            outFromInput.value = "{{ prefill.out_from or '' }}" || tomorrow;
            outToInput.value = "{{ prefill.out_to or '' }}" || nextWeek;
            inFromInput.value = "{{ prefill.in_from or '' }}" || nextWeek;
            inToInput.value = "{{ prefill.in_to or '' }}" || nextWeekLater;

            // Dátum függőség kezelése
            outFromInput.addEventListener('change', () => {
                if (outFromInput.value) {
                    const d = outFromInput.value;
                    [outToInput, inFromInput, inToInput].forEach(el => {
                        el.min = d;
                        if (el.value && el.value < d) el.value = d;
                    });
                }
            });

            outToInput.addEventListener('change', () => {
                if (outToInput.value) {
                    inToInput.min = outToInput.value;
                    if (inToInput.value && inToInput.value < outToInput.value) {
                        inToInput.value = outToInput.value;
                    }
                }
            });

            inFromInput.addEventListener('change', () => {
                if (inFromInput.value) {
                    if (inToInput.value && inToInput.value < inFromInput.value) {
                        inToInput.value = inFromInput.value;
                    }
                    inToInput.min = inFromInput.value;
                }
            });
        </script>

        <button id="searchBtn" class="btn-search" onclick="startSearch()">Járatok keresése</button>

        <div id="status">
            <div id="statusText"></div>
            <div class="loading-bar-container" id="loadingBar">
                <div class="loading-bar"></div>
            </div>
        </div>

        <div id="results"></div>
    </div>

    <script>
        let pollInterval;

        async function startSearch() {
            const btn = document.getElementById('searchBtn');
            const statusDiv = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const loadingBar = document.getElementById('loadingBar');
            const loadingBarInner = loadingBar.querySelector('.loading-bar');
            const resultsDiv = document.getElementById('results');

            const originVal = document.getElementById('origin').value.trim();
            const destinationVal = document.getElementById('destination').value.trim();

            if (!originVal) {
                alert("Kérlek válassz indulási várost / repülőteret!");
                return;
            }

            if (!destinationVal) {
                alert("Kérlek válassz célállomást / repülőteret!");
                return;
            }

            const payload = {
                origin: originVal,
                destination: destinationVal,
                out_from: document.getElementById('out_from').value,
                out_to: document.getElementById('out_to').value,
                in_from: document.getElementById('in_from').value,
                in_to: document.getElementById('in_to').value
            };

            if (!payload.out_from) {
                alert("Kérlek válaszd ki az odaút indulási dátumát!");
                return;
            }

            btn.disabled = true;
            statusDiv.style.display = 'block';
            statusDiv.className = 'status-running';
            statusText.innerText = "🔍 Keresési paraméterek ellenőrzése...";

            // Reset bar to 0 and remove animation for determinate progress
            loadingBar.style.display = 'block';
            loadingBarInner.style.width = '0%';
            loadingBarInner.style.animation = 'none';

            resultsDiv.innerHTML = "";

            try {
                const res = await fetch('/start-intelligence-search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.detail || "Hiba a keresés indításakor");
                }
            } catch (err) {
                btn.disabled = false;
                statusDiv.style.display = 'block';
                statusDiv.className = 'status-error';
                statusText.innerText = "❌ " + err.message;
                loadingBar.style.display = 'none';
                return;
            }

            pollInterval = setInterval(checkStatus, 1000);
        }

        async function checkStatus() {
            const response = await fetch('/search-status');
            const data = await response.json();
            const statusDiv = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const loadingBar = document.getElementById('loadingBar');
            const loadingBarInner = loadingBar.querySelector('.loading-bar');

            if (data.status === 'running') {
                statusText.innerText = data.status_text || "⏳ Adatok gyűjtése...";
                if (data.progress !== undefined) {
                    loadingBarInner.style.width = data.progress + "%";
                }
            } else if (data.status === 'done') {
                clearInterval(pollInterval);
                loadingBarInner.style.width = "100%";

                setTimeout(() => {
                    statusDiv.style.display = 'none';
                    loadingBar.style.display = 'none';
                    document.getElementById('searchBtn').disabled = false;

                    // Sikeres összesítő megjelenítése
                    const resultsDiv = document.getElementById('results');
                    resultsDiv.innerHTML = `
                        <div style="background: #f0f7f0; border: 2px solid #235B2A; border-radius: 15px; padding: 30px; text-align: center; margin-top: 20px;">
                            <h2 style="color: #235B2A; margin-bottom: 10px;">✅ Sikeres adatgyűjtés!</h2>
                            <p style="font-size: 18px; margin-bottom: 20px;">Összesen <strong>${data.count}</strong> lehetséges járatkombinációt találtunk.</p>
                            
                            <div style="display: flex; gap: 10px; justify-content: center;">
                                <button onclick="window.location.href='/flight-intelligence'" class="btn-search" style="background: #666; width: auto; padding: 12px 25px;">Új keresés</button>
                                <button onclick="window.location.href='/flight-intelligence-filter'" class="btn-search" style="width: auto; padding: 12px 40px; font-size: 18px;">
                                    Tovább a preferenciák beállításához ➔
                                </button>
                            </div>
                        </div>
                    `;
                }, 500);
            } else if (data.status === 'error') {
                clearInterval(pollInterval);
                loadingBar.style.display = 'none';
                statusDiv.style.display = 'block';
                statusDiv.style.background = '#ffebee';
                statusDiv.style.color = '#c62828';
                statusDiv.style.border = '1px solid #ef9a9a';
                statusText.innerText = "❌ " + data.error;
                document.getElementById('searchBtn').disabled = false;
            }
        }
    </script>
</body>

</html>
