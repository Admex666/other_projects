{% extends "base.html" %}

{% block title %}Optivoya — Úticél Szempontok Súlyozása{% endblock %}

{% block content %}
<div id="ahp_dest_criteria_container"></div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const rawCriteria = {{ selected_criteria | tojson if selected_criteria else '[{"id":"flight","name":"Repülőjegy ára"},{"id":"cost","name":"Napi költség"},{"id":"weather","name":"Időjárás"},{"id":"safety","name":"Biztonság"}]' }};

        const iconMap = {
            'flight': '✈️',
            'cost': '💰',
            'weather': '☀️',
            'safety': '🛡️',
            'vibe': '🎭',
            'crowds': '👥',
            'travel_time': '⏱️'
        };

        const descMap = {
            'flight': 'Menetjegyek ára és járatsűrűség',
            'cost': 'Étkezés, szolgáltatások és helyi megélhetés',
            'weather': 'Ideális nappali klíma és hőmérséklet',
            'safety': 'Közbiztonság és utazási nyugalom',
            'vibe': 'Hangulat, látnivalók és élmények',
            'crowds': 'Turisták száma és zsúfoltság',
            'travel_time': 'Utazási idő és átszállások száma'
        };

        const criteria = rawCriteria.map(c => ({
            id: c.id,
            name: c.name,
            icon: iconMap[c.id] || '📌',
            desc: descMap[c.id] || 'Döntési szempont'
        }));

        window._ahpInstance = new AHPWizard({
            containerId: 'ahp_dest_criteria_container',
            criteria: criteria,
            title: 'Úticél Szempontok Súlyozása',
            subtitle: 'Hasonlítsd össze a kiválasztott szempontokat párban',
            badge: 'AHP Döntési Modell',
            introTitle: 'Melyik szempont fontosabb számodra?',
            introDesc: 'Hasonlítsd össze a kiválasztott szempontokat a 7 fokozatú skálán a személyre szabott úti cél rangsoroláshoz.',
            ctaText: 'Tovább a Preferenciákhoz',
            backLinkUrl: '/destination-criteria',
            backLinkText: 'Vissza a szempontokhoz',
            onComplete: async function (result) {
                const weights_data = {};
                for (const pairId in result.answers) {
                    const optIdx = result.answers[pairId];
                    // Map 7-point scale index to ratio
                    const scaleRatios = [7.0, 5.0, 3.0, 1.0, 1/3, 1/5, 1/7];
                    weights_data[pairId] = scaleRatios[optIdx];
                }

                try {
                    await fetch('/api/destination-ahp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ comparisons: weights_data })
                    });
                    window.location.href = '/destination-preferences';
                } catch (e) {
                    console.error(e);
                    window.location.href = '/destination-preferences';
                }
            }
        });
    });
</script>
{% endblock %}
