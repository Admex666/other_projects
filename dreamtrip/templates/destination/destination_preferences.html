{% extends "base.html" %}

{% block title %}Optivoya — Döntési Preferenciák & Súlyozás{% endblock %}

{% block content %}
<div id="ahp_container"></div>
{% endblock %}

{% block scripts %}
<script>
    let currentTargetTemp = 24;

    function getTempSubtitle(t) {
        if (t < 20) return 'Hűvösebb, friss kiránduló idő';
        if (t <= 24) return 'Kellemes, ideális városnéző klíma';
        if (t <= 29) return 'Meleg, napos nyári időjárás';
        return 'Forró, strandolós tengerparti idő';
    }

    function updateTemp(val) {
        currentTargetTemp = parseInt(val, 10);
        try { sessionStorage.setItem('ahp_dest_temp', currentTargetTemp); } catch (e) {}
        
        const disp = document.getElementById('temp_display');
        if (disp) disp.innerText = currentTargetTemp;
        
        const sub = document.getElementById('temp_subtitle');
        if (sub) sub.innerText = getTempSubtitle(currentTargetTemp);

        document.querySelectorAll('.date-preset-pills .preset-pill').forEach(p => {
            const pillVal = parseInt(p.getAttribute('data-temp'), 10);
            if (pillVal === currentTargetTemp) p.classList.add('active');
            else p.classList.remove('active');
        });
    }

    function setTempPreset(val, text, btn) {
        currentTargetTemp = parseInt(val, 10);
        try { sessionStorage.setItem('ahp_dest_temp', currentTargetTemp); } catch (e) {}

        const slider = document.getElementById('weather_temp_input');
        if (slider) slider.value = currentTargetTemp;
        
        const disp = document.getElementById('temp_display');
        if (disp) disp.innerText = currentTargetTemp;
        
        const sub = document.getElementById('temp_subtitle');
        if (sub) sub.innerText = text;
        
        document.querySelectorAll('.date-preset-pills .preset-pill').forEach(p => p.classList.remove('active'));
        if (btn) btn.classList.add('active');
    }

    document.addEventListener('DOMContentLoaded', () => {
        try {
            const savedTemp = sessionStorage.getItem('ahp_dest_temp');
            if (savedTemp) {
                const parsed = parseInt(savedTemp, 10);
                if (!isNaN(parsed) && parsed >= 15 && parsed <= 38) {
                    currentTargetTemp = parsed;
                }
            }
        } catch (e) {}

        const criteria = [
            {
                id: 'flight',
                name: 'Repülőjegy ára',
                icon: '✈️',
                desc: 'Kedvező retúr repülőjegy árak és optimális utazási idő'
            },
            {
                id: 'cost',
                name: 'Napi költségek',
                icon: '💰',
                desc: 'Helyi étkezés, szolgáltatások és napi megélhetési szint'
            },
            {
                id: 'weather',
                name: 'Ideális időjárás',
                icon: '☀️',
                desc: 'A választott célhőmérséklethez való pontos illeszkedés'
            },
            {
                id: 'safety',
                name: 'Közbiztonság',
                icon: '🛡️',
                desc: 'Kiemelkedő biztonsági index és nyugodt utazási környezet'
            }
        ];

        const climateSlotHtml = `
            <div class="advisor-section-label">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <span>Célhőmérséklet Meghatározása (Nappali csúcs)</span>
            </div>

            <div style="background: var(--bg-surface); border: 1px solid var(--border-subtle); padding: 20px 24px; border-radius: 18px; text-align: center; margin-top: 10px;">
                <div style="font-size: 38px; font-weight: 800; font-family: var(--font-mono); color: var(--primary); margin-bottom: 4px;">
                    <span id="temp_display">${currentTargetTemp}</span>°C
                </div>
                <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;" id="temp_subtitle">
                    ${getTempSubtitle(currentTargetTemp)}
                </div>
                <input type="range" id="weather_temp_input" min="15" max="38" step="1" value="${currentTargetTemp}" 
                    style="width: 100%; max-width: 480px; accent-color: var(--primary);" 
                    oninput="updateTemp(this.value)">
                
                <div class="date-preset-pills" style="justify-content: center; margin-top: 16px;">
                    <div class="preset-pill ${currentTargetTemp === 18 ? 'active' : ''}" data-temp="18" onclick="setTempPreset(18, 'Hűvösebb, friss kiránduló idő', this)">❄️ 18°C</div>
                    <div class="preset-pill ${currentTargetTemp === 22 ? 'active' : ''}" data-temp="22" onclick="setTempPreset(22, 'Kellemes, ideális városnéző klíma', this)">🌤️ 22°C</div>
                    <div class="preset-pill ${currentTargetTemp === 25 ? 'active' : ''}" data-temp="25" onclick="setTempPreset(25, 'Meleg, napos nyári időjárás', this)">☀️ 25°C</div>
                    <div class="preset-pill ${currentTargetTemp === 30 ? 'active' : ''}" data-temp="30" onclick="setTempPreset(30, 'Forró, strandolós tengerparti idő', this)">🔥 30°C</div>
                </div>
            </div>
        `;


        window._ahpInstance = new AHPWizard({
            containerId: 'ahp_container',
            criteria: criteria,
            title: 'Preferenciák & Döntési Súlyozás',
            subtitle: 'Határozd meg a szempontok prioritását a legmegfelelőbb úti célok kiválasztásához',
            badge: 'Szempontok Súlyozása',
            introTitle: 'Mi fontos az úti cél kiválasztásánál?',
            introDesc: 'Nincs jó vagy rossz válasz. Hasonlítsd össze a 4 szempontot páronként, és mi ezek alapján személyre szabjuk a célállomások rangsorát.',
            introSlotHtml: climateSlotHtml,
            ctaText: '🚀 Célállomások Kiszámítása & Elemzése (Valós adatokkal)',
            backLinkUrl: '/destination-matcher',
            backLinkText: 'Vissza az alapadatokhoz',
            onComplete: async function (result) {
                const payload = {
                    weather_temp: currentTargetTemp,
                    weight_flight: Math.round((result.weights.flight || 0.25) * 100),
                    weight_cost: Math.round((result.weights.cost || 0.25) * 100),
                    weight_weather: Math.round((result.weights.weather || 0.25) * 100),
                    weight_safety: Math.round((result.weights.safety || 0.25) * 100)
                };

                try {
                    const submitBtn = document.querySelector('.ahp-btn-submit');
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<span>Kalkuláció indítása folyamatban...</span>';
                    }

                    await fetch('/api/calculate-destinations', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    window.location.href = '/destination-results';
                } catch (e) {
                    console.error('Hiba kalkuláció indításakor:', e);
                    window.location.href = '/destination-results';
                }
            }
        });
    });
</script>
{% endblock %}
