<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontosságok Súlyozása (AHP) - Optivoya</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #235B2A 0%, #1a4520 100%);
            min-height: 100vh;
            padding: 20px;
            /* REMOVED FLEX CENTERING */
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 40px;
            border-radius: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            color: #235B2A;
            margin-left: 10px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logout-btn {
            background: #235B2A;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: #90DC25;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            /* Added centering */
            background: rgba(255, 255, 255, 0.98);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            color: #235B2A;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 20px;
            font-size: 15px;
        }

        .comparison-container {
            margin-top: 30px;
            text-align: left;
        }

        .comparison-row {
            background: #f9f9f9;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 1px solid #eee;
        }

        .comp-labels {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .range-container {
            position: relative;
            padding: 0 10px;
        }

        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #235B2A;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #ddd;
            border-radius: 2px;
        }

        .markers {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 12px;
            color: #999;
        }

        .btn-next {
            padding: 15px 50px;
            background: linear-gradient(90deg, #235B2A, #2e7d32);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(35, 91, 42, 0.3);
        }

        .btn-back {
            display: inline-block;
            text-decoration: none;
            color: #666;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
            transition: all 0.3s;
        }

        .btn-back:hover {
            color: #235B2A;
            transform: translateX(-5px);
        }
    </style>
</head>

<body>
    <div class="navbar">
        <a href="/home" style="text-decoration: none; display: flex; align-items: center; gap: 10px;">
            <img src="/static/logo.png" alt="Optivoya" style="height: 40px;">
            <span class="logo-text">Optivoya</span>
            <span
                style="background: #90DC25; color: #235B2A; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; margin-left: 8px; border: 1px solid rgba(144, 220, 37, 0.2); letter-spacing: 0.5px; white-space: nowrap;">Early
                Access</span>
        </a>
        <div class="user-info">
            <span style="color: #666;">👤 {{ user }}</span>
            <a href="/logout" class="logout-btn">Kilépés</a>
        </div>
    </div>
    <div class="container">
        <a href="/destination-criteria" class="btn-back">← Vissza a szempontokhoz</a>
        <h1>⚖️ Mi a fontosabb?</h1>
        <p class="subtitle">3. lépés: Hasonlítsd össze a szempontokat páronként! <br>Ha balra húzod, a bal oldali
            fontosabb, ha jobbra, akkor a jobb oldali.</p>

        <div id="comparisons" class="comparison-container">
            <!-- Dynamically populated pairs -->
        </div>

        <button class="btn-next" onclick="submitAHP()">Tovább a részletekhez ➔</button>
    </div>

    <script>
        // REAL DATA from Jinja2
        var criteria;
        // {% if selected_criteria %}
        criteria = {{ selected_criteria | tojson }};
        // {% else %}
        criteria = [
            { id: 'weather', name: 'Időjárás' },
            { id: 'cost', name: 'Költségek' },
            { id: 'vibe', name: 'Hangulat' }
        ];
        // {% endif %}

        const comparisonsDiv = document.getElementById('comparisons');
        const pairs = [];

        function renderComparisons() {
            comparisonsDiv.innerHTML = '';
            for (let i = 0; i < criteria.length; i++) {
                for (let j = i + 1; j < criteria.length; j++) {
                    const c1 = criteria[i];
                    const c2 = criteria[j];
                    pairs.push({ c1: c1.id, c2: c2.id });

                    const div = document.createElement('div');
                    div.className = 'comparison-row';
                    div.innerHTML = `
                        <div class="comp-labels">
                            <span style="color: #235B2A">${c1.name}</span>
                            <span style="color: #2e7d32">${c2.name}</span>
                        </div>
                        <div class="range-container">
                            <input type="range" class="ahp-slider" min="-9" max="9" step="1" value="0" 
                                data-c1="${c1.id}" data-c2="${c2.id}">
                            <div class="markers">
                                <span>Extrém</span>
                                <span>Erős</span>
                                <span>Egyenlő</span>
                                <span>Erős</span>
                                <span>Extrém</span>
                            </div>
                        </div>
                    `;
                    comparisonsDiv.appendChild(div);
                }
            }
        }

        renderComparisons();

        async function submitAHP() {
            const weights_data = {};
            document.querySelectorAll('.ahp-slider').forEach(slider => {
                const c1 = slider.dataset.c1;
                const c2 = slider.dataset.c2;
                const val = parseInt(slider.value);

                // Convert slide value (-9 to 9) to AHP ratio (1/9 to 9)
                // Slider -9 (Left extreme) -> C1 is 9x C2 -> Ratio 9
                // Slider +9 (Right extreme) -> C2 is 9x C1 -> Ratio 1/9

                let ratio;
                if (val === 0) ratio = 1;
                else if (val < 0) ratio = Math.abs(val) + 1; // Left dominance
                else ratio = 1 / (val + 1); // Right dominance

                weights_data[`${c1}_vs_${c2}`] = ratio;
            });

            console.log("Submitting weights:", weights_data);

            try {
                const response = await fetch('/api/destination-ahp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ comparisons: weights_data })
                });

                if (response.ok) {
                    window.location.href = '/destination-preferences';
                } else {
                    alert("Hiba mentéskor");
                }
            } catch (e) {
                console.error(e);
                alert("Hálózati hiba (vagy nincs backend)");
            }
        }
    </script>
</body>

</html>
