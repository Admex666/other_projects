{% extends "base.html" %}

{% block title %}Optivoya — Szállás Preferenciák Súlyozása{% endblock %}

{% block content %}
<div id="ahp_stay_container"></div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const criteria = [
            {
                id: 'price',
                name: 'Szállás ára',
                icon: '🏨',
                desc: 'Éjszakánkénti és teljes tartózkodási szállásköltség'
            },
            {
                id: 'rating',
                name: 'Vendégértékelés',
                icon: '⭐',
                desc: 'Korábbi utazók minőségi értékelése (0-10 skálán)'
            },
            {
                id: 'reviews',
                name: 'Vélemények száma',
                icon: '💬',
                desc: 'Népszerűség és az értékelések megbízhatósága'
            },
            {
                id: 'distance',
                name: 'Belvárosi távolság',
                icon: '📍',
                desc: 'Központi elhelyezkedés és a látnivalók elérhetősége'
            }
        ];

        window._ahpInstance = new AHPWizard({
            containerId: 'ahp_stay_container',
            criteria: criteria,
            title: 'Szállás Preferenciák & Súlyozás',
            subtitle: 'Határozd meg a szállásválasztási szempontjaid prioritását',
            badge: 'Accommodation Intelligence',
            introTitle: 'Mi a legfontosabb számodra a szállásnál?',
            introDesc: 'Hasonlítsd össze a 4 szálláskritériumot páronként a 7 fokozatú skálán, és személyre szabjuk az ajánlatok rangsorát.',
            ctaText: 'Tovább a Küszöbértékek Finomhangolásához',
            backLinkUrl: '/accommodation-intelligence',
            backLinkText: 'Vissza a kereséshez',
            onComplete: async function (result) {
                const payload = {
                    price: result.weights.price || 0.25,
                    rating: result.weights.rating || 0.25,
                    reviews: result.weights.reviews || 0.25,
                    distance: result.weights.distance || 0.25
                };

                try {
                    const submitBtn = document.querySelector('.ahp-btn-submit');
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<span>Preferenciák mentése...</span>';
                    }

                    await fetch('/api/save-stay-ahp-weights', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    window.location.href = '/accommodation-intelligence-preferences';
                } catch (e) {
                    console.error('Hiba a súlyok mentésekor:', e);
                    window.location.href = '/accommodation-intelligence-preferences';
                }
            }
        });
    });
</script>
{% endblock %}
