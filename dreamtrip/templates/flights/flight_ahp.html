{% extends "base.html" %}

{% block title %}Optivoya — Repülőjegy Preferenciák Súlyozása{% endblock %}

{% block content %}
<div id="ahp_flight_container"></div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const criteria = [
            {
                id: 'price',
                name: 'Repülőjegy ára',
                icon: '💳',
                desc: 'A retúr repülőjegyek teljes költsége az összes utasra'
            },
            {
                id: 'departure',
                name: 'Indulási időpont',
                icon: '⏰',
                desc: 'Ideális napszakban történő indulás és érkezés'
            },
            {
                id: 'travel_time',
                name: 'Összes utazási idő',
                icon: '⏱️',
                desc: 'Menetidő és átszállási várakozások hossza'
            },
            {
                id: 'stops',
                name: 'Átszállások száma',
                icon: '🔄',
                desc: 'Közvetlen járatok előnyben részesítése átszállásokkal szemben'
            },
            {
                id: 'stay',
                name: 'Tartózkodási idő',
                icon: '📅',
                desc: 'A célállomáson eltöltött ideális napok száma'
            }
        ];

        window._ahpInstance = new AHPWizard({
            containerId: 'ahp_flight_container',
            criteria: criteria,
            title: 'Repülőjegy Preferenciák & Súlyozás',
            subtitle: 'Határozd meg a repülési szempontok fontosságát és sorrendjét',
            badge: 'Flight Intelligence',
            introTitle: 'Mi a legfontosabb a járatok kiválasztásakor?',
            introDesc: 'Hasonlítsd össze az 5 repülési szempontot páronként, és személyre szabjuk a járatkombinációk rangsorát.',
            ctaText: 'Tovább a Kritériumok Finomhangolásához',
            backLinkUrl: '/flight-intelligence-filter',
            backLinkText: 'Vissza a szűrőkhöz',
            onComplete: async function (result) {
                const orderedKeys = ['price', 'departure', 'travel_time', 'stops', 'stay'];
                const weightsArray = orderedKeys.map(k => result.weights[k] || (1 / orderedKeys.length));

                try {
                    const submitBtn = document.querySelector('.ahp-btn-submit');
                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<span>Preferenciák mentése...</span>';
                    }

                    await fetch('/api/save-ahp-weights', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            weights: weightsArray,
                            criteria: orderedKeys
                        })
                    });

                    window.location.href = '/flight-intelligence-preferences';
                } catch (e) {
                    console.error('Hiba a súlyok mentésekor:', e);
                    window.location.href = '/flight-intelligence-preferences';
                }
            }
        });
    });
</script>
{% endblock %}
