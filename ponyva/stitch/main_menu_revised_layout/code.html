<!DOCTYPE html>

<html class="dark" lang="en"><head>

<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Paprika Chaos - Main Menu</title>

              "surface-container-highest": "#3d332d",

<style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
      }
      .parchment-overlay {
        background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuBehVABAc0tLk36vqbrsTCtsPUtL6CtFZGBsjtgsWloToyBfYpoBfNpSsXUOtzmNde516B4KCzuTjlrqcF7IAVTrSWCAHU2jBkvRrRtiGwMhqbLanAWnJlLRh5lxtIWLO-7Fo129lUaYAj3L5PiIrtHXhEtBaGYp_COO2yhPH-0ACAzZVPYwYBX7NcsMYQ6AjXwZ_N3w9AU3n5iKcYpvm1flTd4TPtvrg-45wB5TH7KfRzsd-LG8C_CstQTJLgJYcK09X-gmiodTg);
        mix-blend-mode: overlay;
        pointer-events: none
      }
      .folk-pattern {
        background-image: radial-gradient(circle at 2px 2px, #3d332d 1px, transparent 0);
        background-size: 24px 24px
      }
      .spring-animation:active {
        transform: scale(0.95);
        transition: transform 0.1s cubic-bezier(0.34, 1.56, 0.64, 1)
      }
      .grimoire-illustration {
        background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBULXwYYqKwuD6aODbST8tAgs2eEMfnhTkOF_K7LUi7JfUX99oCGx1ATi5mY_Cd3vu4BiSAETRciDZopxF774J7CEBC7fcM4GIssPUK9ACvs4getENUrSzPfj_EaIXed2JIby7WEGrOb799JsH8RAvThSWAGOrNpnr5NgyEOTGfZFOvvcHcGMp_bEVkLVHD9a3UfSEEJRw68RTshn7yfAPpvV-xHZ_DiAF-HBzAnMQ3lwMyYbS73KzykWaSpF3t3Tgk5AT6kBbPJA');
        background-size: cover;
        background-position: center;
        mask-image: linear-gradient(to bottom, black 0%, black 70%, transparent 100%);
      }
      body {
        min-height: max(884px, 100dvh);
      }

</head>
<body class="bg-background text-on-background font-body selection:bg-primary selection:text-on-primary min-h-screen overflow-hidden flex flex-col">
<!-- Background Layers -->
<div class="fixed inset-0 grimoire-illustration opacity-10 z-0"></div>
<div class="fixed inset-0 parchment-overlay opacity-30 z-0"></div>
<div class="fixed inset-0 folk-pattern opacity-10 z-0"></div>
<!-- 1. Top Bar -->
<header class="relative z-50 flex justify-between items-start px-6 pt-6 pb-2">
<div class="flex flex-col gap-1">
<div class="flex items-center gap-3">
<div class="w-14 h-14 rounded-full border-2 border-primary overflow-hidden shadow-lg bg-surface-container-high">
<img alt="Player Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuANXtGJagaTNFqE3-ASqqy7N5QWiDqDqXbwthOm9976xyJAwO7cz2LNioYLuGGNPtYgUlTmjCXL7pPoXGCG4mmq5e1QSq0HgETqpz5Wduk_85nh8nud0bx3VPBuUGfO0Tk6sra8g3nkoj_o-LYR0CTCE9QE4koY18fVMpibm7FrFC1-YZ_sOlMqyaae-WBdihd2QbZ7Q9bQiFN8fKiZcP7jHKsLKTd0nVOiTOK4TxHt5dp3hfaelszioF4iZxwM7JkHkCScbDCe5g"/>
</div>
<div class="flex flex-col">
<h1 class="text-xl font-headline font-black text-primary tracking-tight uppercase">Csaba the Bold</h1>
<span class="text-xs font-label text-secondary uppercase tracking-widest">Level 24</span>
</div>
</div>
<!-- XP Bar directly underneath avatar -->
<div class="w-32 h-2 bg-surface-container-highest rounded-full overflow-hidden mt-1 ml-1">
<div class="bg-primary w-[65%] h-full rounded-full"></div>
</div>
</div>
<div class="flex flex-col items-end gap-2">
<div class="flex items-center gap-4 bg-surface-container/60 backdrop-blur px-4 py-2 rounded-2xl border border-outline-variant/30">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-tertiary text-xl" style="font-variation-settings: 'FILL' 1;">generating_tokens</span>
<span class="font-headline font-bold text-tertiary">1,250</span>
</div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-secondary text-xl" style="font-variation-settings: 'FILL' 1;">pentagon</span>
<span class="font-headline font-bold text-secondary">42</span>
</div>
</div>
</div>
</header>
<!-- 2. Center Panel: Vertical list of buttons -->
<main class="relative z-10 flex-grow flex flex-col items-center justify-center px-6 gap-4">
<!-- Play / Quick Match -->
<button class="w-full max-w-sm spring-animation group relative flex flex-col items-start p-5 bg-[#a62121] rounded-2xl shadow-xl border-b-4 border-[#680007] overflow-hidden">
<div class="relative z-10 flex items-center gap-4">
<div class="w-12 h-12 bg-on-primary-container/20 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-on-primary-container text-3xl" style="font-variation-settings: 'FILL' 1;">swords</span>
</div>
<div class="text-left">
<h3 class="font-headline text-2xl font-black text-on-primary-container tracking-wide uppercase leading-none">Play</h3>
<p class="text-xs font-body italic text-on-primary-container/80 mt-1">Jump into a quick match with opponents</p>
</div>
</div>
<!-- Ornament -->
<span class="material-symbols-outlined absolute -right-4 -bottom-4 text-8xl text-on-primary-container/10 rotate-12">local_fire_department</span>
</button>
<!-- Deck Builder -->
<button class="w-full max-w-sm spring-animation group relative flex flex-col items-start p-5 bg-[#315035] rounded-2xl shadow-xl border-b-4 border-[#18371e] overflow-hidden">
<div class="relative z-10 flex items-center gap-4">
<div class="w-12 h-12 bg-secondary-fixed/20 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-secondary-fixed text-3xl" style="font-variation-settings: 'FILL' 1;">style</span>
</div>
<div class="text-left">
<h3 class="font-headline text-2xl font-black text-secondary-fixed tracking-wide uppercase leading-none">Deck Builder</h3>
<p class="text-xs font-body italic text-secondary-fixed/80 mt-1">Refine your strategy and card combos</p>
</div>
</div>
<span class="material-symbols-outlined absolute -right-4 -bottom-4 text-8xl text-secondary-fixed/10 rotate-12">park</span>
</button>
<!-- Collection -->
<button class="w-full max-w-sm spring-animation group relative flex flex-col items-start p-5 bg-[#734f00] rounded-2xl shadow-xl border-b-4 border-[#432c00] overflow-hidden">
<div class="relative z-10 flex items-center gap-4">
<div class="w-12 h-12 bg-tertiary-fixed/20 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-tertiary-fixed text-3xl" style="font-variation-settings: 'FILL' 1;">layers</span>
</div>
<div class="text-left">
<h3 class="font-headline text-2xl font-black text-tertiary-fixed tracking-wide uppercase leading-none">Collection</h3>
<p class="text-xs font-body italic text-tertiary-fixed/80 mt-1">Browse 142 unique grimoire entries</p>
</div>
</div>
<span class="material-symbols-outlined absolute -right-4 -bottom-4 text-8xl text-tertiary-fixed/10 rotate-12">auto_stories</span>
</button>
<!-- Event / Tournament (Locked) -->
<button class="w-full max-w-sm opacity-60 grayscale group relative flex flex-col items-start p-5 bg-surface-container-high rounded-2xl shadow-xl border-b-4 border-surface-container-highest overflow-hidden cursor-not-allowed">
<div class="relative z-10 flex items-center gap-4">
<div class="w-12 h-12 bg-outline/20 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-outline text-3xl">lock</span>
</div>
<div class="text-left">
<h3 class="font-headline text-2xl font-black text-on-surface-variant tracking-wide uppercase leading-none">Tournaments</h3>
<p class="text-xs font-body italic text-on-surface-variant/80 mt-1">Unlocks at player level 30</p>
</div>
</div>
</button>
<!-- Settings -->
<button class="w-full max-w-sm spring-animation group relative flex flex-col items-start p-5 bg-surface-container-low rounded-2xl shadow-xl border-b-4 border-surface-container-highest overflow-hidden">
<div class="relative z-10 flex items-center gap-4">
<div class="w-12 h-12 bg-outline/20 rounded-xl flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface text-3xl">settings</span>
</div>
<div class="text-left">
<h3 class="font-headline text-2xl font-black text-on-surface tracking-wide uppercase leading-none">Settings</h3>
<p class="text-xs font-body italic text-on-surface-variant mt-1">Adjust audio, account, and gameplay</p>
</div>
</div>
</button>
</main>
<!-- 4. Footer: News & Season Info (Scrollable) -->
<footer class="relative z-50 bg-[#221a15]/95 backdrop-blur-xl border-t border-outline-variant/20 rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
<div class="px-8 pt-4 pb-2">
<div class="flex items-center justify-between mb-3">
<h2 class="font-headline font-bold text-secondary uppercase tracking-[0.2em] text-xs">News &amp; Season info</h2>
<span class="material-symbols-outlined text-secondary text-sm">notifications_active</span>
</div>
<div class="overflow-x-auto pb-4 hide-scrollbar flex gap-6 snap-x">
<!-- News Item 1 -->
<div class="min-w-[280px] snap-center flex flex-col gap-2">
<div class="flex items-center justify-between">
<span class="text-[10px] font-label text-tertiary bg-tertiary/10 px-2 py-0.5 rounded uppercase font-bold">Event</span>
<span class="text-[10px] text-on-surface-variant">Ends in 4d</span>
</div>
<h4 class="font-body text-lg italic text-on-surface leading-none">The Great Chili Harvest</h4>
<p class="text-xs text-on-surface-variant line-clamp-1">Collect limited edition card sets now.</p>
<div class="w-full bg-surface-container-highest rounded-full h-1.5 mt-1">
<div class="bg-tertiary w-3/4 h-full rounded-full"></div>
</div>
</div>
<!-- News Item 2 -->
<div class="min-w-[280px] snap-center flex flex-col gap-2">
<div class="flex items-center justify-between">
<span class="text-[10px] font-label text-primary bg-primary/10 px-2 py-0.5 rounded uppercase font-bold">Update</span>
<span class="text-[10px] text-on-surface-variant">New</span>
</div>
<h4 class="font-body text-lg italic text-on-surface leading-none">Patch 1.4: Spice Balance</h4>
<p class="text-xs text-on-surface-variant line-clamp-1">Adjustments to Fire-type cards and damage.</p>
</div>
</div>
</div>
<!-- Safe area spacer for mobile -->
<div class="h-4"></div>
</footer>
<!-- Bottom Navigation Accents -->
<div class="fixed bottom-4 left-4 z-0 opacity-10 pointer-events-none">
<img alt="Folk Ornament" class="w-24 h-24" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDdctrnu89Wx3NLv6rmWyl9j1j5COQpMJVJRHl-N87NLgn4hbBB5IahMh1gbm--n0lMsSNaRWUybxkBQPsXV2b52VJQqyuGSPAcF4JksOb8onFLyCsJYh8yrs_9tLc03KmzDckfSBHn-PbHLaFMpx2Z72bCnCtYvnDrkOxZCQrTLq8CB2je34EgpONmNJJ5KvsnJH54o9xNSY1By_mtMZYQX3EpRjZkg8MsxfhSqi1h7Vrk5JgtuTXMgWouTJ-QTDouMGCv2bVnxQ"/>
</div>
<div class="fixed bottom-4 right-4 z-0 opacity-10 pointer-events-none">

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {

            scrollbar-width: none;
