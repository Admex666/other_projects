    - assets/mist_apartment_interior.png
    - assets/mist_journal_clue.png
    - assets/mist_shadows_stairs.png
    - assets/mist_city_intro.png
    - assets/mist_gozsdu_crowd.png
    - assets/mist_opera_phantom.png
    - assets/normafa_cover.png
