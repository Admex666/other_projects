name: storyturak_mobile
description: A new Flutter project for StoryTurak.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0
  provider: ^6.0.0
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  web_socket_channel: ^2.4.3
  flutter_compass: ^0.8.0
  animations: ^2.0.11
  flutter_local_notifications: ^19.5.0
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
