<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=device-width">
    <title>VitaSteps Kísérőkártyák (A6 x 4)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Playfair+Display:ital,wght@0,600;1,400&display=swap"
        rel="stylesheet">
    <style>
        /* Reset and Print Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f7f7f7;
            color: #000000;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* A4 Page container */
        .page {
            width: 210mm;
            height: 297mm;
            background: #ffffff;
            margin: 20px auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: grid;
            grid-template-columns: 105mm 105mm;
            grid-template-rows: 148.5mm 148.5mm;
            position: relative;
        }

        /* Card layout */
        .card {
            width: 105mm;
            height: 148.5mm;
            padding: 12mm 10mm;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
            position: relative;
            background: #ffffff;
            border: 1px dashed #dddddd;
            /* Cut lines */
        }

        /* Decorative border inside card */
        .card-inner-border {
            position: absolute;
            top: 6mm;
            bottom: 6mm;
            left: 6mm;
            right: 6mm;
            border: 1px solid #111111;
            pointer-events: none;
        }

        .card-corner {
            position: absolute;
            width: 3mm;
            height: 3mm;
            border: 1px solid #111111;
        }

        .corner-tl {
            top: 5mm;
            left: 5mm;
            border-right: none;
            border-bottom: none;
        }

        .corner-tr {
            top: 5mm;
            right: 5mm;
            border-left: none;
            border-bottom: none;
        }

        .corner-bl {
            bottom: 5mm;
            left: 5mm;
            border-right: none;
            border-top: none;
        }

        .corner-br {
            bottom: 5mm;
            right: 5mm;
            border-left: none;
            border-top: none;
        }

        /* Typography & elements */
        .header {
            margin-top: 2mm;
        }

        .logo {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        .divider {
            width: 30mm;
            height: 1px;
            background-color: #000000;
            margin: 3mm auto 0 auto;
        }

        .middle {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 0 2mm;
        }

        .icon {
            width: 12mm;
            height: 12mm;
            margin-bottom: 4mm;
        }

        .title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-bottom: 2mm;
            text-transform: uppercase;
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 14px;
            color: #333333;
            margin-bottom: 4mm;
        }

        .text {
            font-size: 11px;
            line-height: 1.6;
            color: #444444;
            max-width: 75mm;
        }

        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2mm;
            margin-bottom: 2mm;
        }

        .qr-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3mm;
        }

        .qr-code {
            width: 14mm;
            height: 14mm;
            border: 1px solid #111111;
            padding: 1px;
        }

        .website-info {
            text-align: left;
        }

        .website-url {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.05em;
        }

        .website-sub {
            font-size: 9px;
            color: #666666;
        }

        .signature {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.02em;
            margin-top: 1mm;
        }

        /* Screen controls */
        .controls {
            max-width: 210mm;
            margin: 20px auto 0 auto;
            padding: 15px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-print {
            background: #111111;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-print:hover {
            opacity: 0.9;
        }

        .instructions {
            font-size: 12px;
            color: #666666;
        }

        /* Print Override */
        @media print {
            body {
                background-color: #ffffff;
            }

            .controls {
                display: none;
            }

            .page {
                margin: 0;
                box-shadow: none;
                page-break-after: always;
            }

            .card {
                /* Keep the border subtle for cutting guide */
                border: 1px dotted #bbbbbb;
            }
        }
    </style>
</head>

<body>

    <div class="controls">
        <div class="instructions">
            <strong>Nyomtatási beállítások:</strong> Válaszd az <strong>Álló (Portrait)</strong>
            tájolást, a margókat állítsd <strong>Nincs (None)</strong> értékre.
        </div>
        <button class="btn-print" onclick="window.print()">Kártyák Nyomtatása</button>
    </div>

    <div class="page" id="page"></div>

    <script>
        // ============================================================
        // KONFIGURÁCIÓ – csak itt kell módosítani:
        const QR_CODE_URL = "https://www.facebook.com/profile.php?id=61574268396665";
        const CARD_COUNT = 4;
        // ============================================================

        function createCard() {
            const qrUrlEncoded = encodeURIComponent(QR_CODE_URL);
            return `
                <div class="card">
                    <div class="card-inner-border"></div>
                    <div class="card-corner corner-tl"></div>
                    <div class="card-corner corner-tr"></div>
                    <div class="card-corner corner-bl"></div>
                    <div class="card-corner corner-br"></div>

                    <div class="header">
                        <div class="logo">VitaSteps</div>
                        <div class="divider"></div>
                    </div>

                    <div class="middle">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="8" r="7" />
                            <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88" />
                        </svg>
                        <div class="title">Gratulálunk!</div>
                        <div class="subtitle">Büszke lehetsz erre az eredményre.</div>
                        <div class="text">
                            Ez az érem a Te kitartásod és elkötelezettséged szimbóluma. Örülünk, hogy a VitaSteps közösség
                            tagjaként velünk teljesítetted a kihívást!
                        </div>
                    </div>

                    <div class="footer">
                        <div class="qr-section">
                            <img class="qr-code"
                                src="https://api.qrserver.com/v1/create-qr-code/?size=100&data=${qrUrlEncoded}"
                                alt="QR Code">
                            <div class="website-info">
                                <div class="website-url">VitaSteps</div>
                                <div class="website-sub">Oszd meg a sikered!</div>
                            </div>
                        </div>
                        <div class="signature">Találkozunk a csúcson!</div>
                    </div>
                </div>`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const page = document.getElementById("page");
            for (let i = 0; i < CARD_COUNT; i++) {
                page.insertAdjacentHTML("beforeend", createCard());
            }
        });
    </script>

</body>

</html>
