<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaSteps – Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #04060a;
            --surface: #0c0f15;
            --surface2: #12161e;
            --accent: #f97316; /* orange for admin */
            --accent-glow: rgba(249, 115, 22, 0.2);
            --green: #22c55e;
            --green-glow: rgba(34, 197, 94, 0.2);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.2);
            --text-high: #f0f4ff;
            --text-mid: #7a8aa0;
            --text-low: #3d4a5c;
            --border: rgba(255, 255, 255, 0.07);
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text-high);
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .container { max-width: 900px; margin: 0 auto; }

        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
        }
        .logo span { color: var(--accent); }
        .admin-label {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent);
            background: rgba(249, 115, 22, 0.1);
            border: 1px solid rgba(249, 115, 22, 0.3);
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            margin-bottom: 2.5rem;
        }

        /* Login Screen */
        #screen-login {
            max-width: 420px;
            margin: 5rem auto;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 2rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1.25rem;
        }

        .input-text {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-high);
            padding: 0.85rem 1rem;
            font-size: 1rem;
            font-family: inherit;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }
        .input-text:focus { outline: none; border-color: var(--accent); }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.9rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

        .btn-approve {
            background: var(--green);
            color: #04060a;
            box-shadow: 0 4px 12px var(--green-glow);
            width: auto;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
        }
        .btn-approve:hover { filter: brightness(1.1); }

        .btn-reject {
            background: transparent;
            color: var(--red);
            border: 1px solid rgba(239, 68, 68, 0.4);
            width: auto;
            padding: 0.6rem 1.2rem;
            font-size: 0.9rem;
        }
        .btn-reject:hover { background: rgba(239, 68, 68, 0.1); }

        /* Dashboard */
        #screen-dashboard { display: none; }

        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .stats-bar {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .stat-chip {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }
        .stat-chip strong { color: var(--accent); }

        .filter-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }
        .filter-tab {
            background: none;
            border: none;
            color: var(--text-mid);
            font-weight: 600;
            font-size: 0.9rem;
            font-family: inherit;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .filter-tab.active {
            background: rgba(249, 115, 22, 0.1);
            color: var(--accent);
        }

        /* Proof Cards */
        .proof-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            transition: border-color 0.2s;
        }
        .proof-card:hover { border-color: rgba(249, 115, 22, 0.25); }

        .proof-card.approved { border-color: rgba(34, 197, 94, 0.3); }
        .proof-card.rejected { opacity: 0.5; }

        .proof-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }

        .runner-name {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 0.2rem;
        }
        .runner-meta {
            font-size: 0.82rem;
            color: var(--text-mid);
            line-height: 1.6;
        }

        .badges {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .badge {
            font-size: 0.72rem;
            font-weight: 700;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .badge-serial {
            background: rgba(249, 115, 22, 0.1);
            border: 1px solid rgba(249, 115, 22, 0.4);
            color: var(--accent);
        }
        .badge-pending {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #f59e0b;
        }
        .badge-approved {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: var(--green);
        }

        /* File previews */
        .proof-files {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-bottom: 1.25rem;
        }

        .proof-thumb {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            background: var(--surface2);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        .proof-thumb:hover { transform: scale(1.04); border-color: var(--accent); }
        .proof-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .proof-file-link {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-high);
            text-decoration: none;
            transition: border-color 0.2s;
            height: 100px;
            flex-direction: column;
            justify-content: center;
            width: 100px;
            text-align: center;
            word-break: break-all;
            font-size: 0.75rem;
        }
        .proof-file-link:hover { border-color: var(--accent); color: var(--accent); }
        .proof-file-link .file-icon { font-size: 1.8rem; }

        .proof-actions {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .action-result {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-mid);
        }

        .submitted-time {
            font-size: 0.78rem;
            color: var(--text-low);
            margin-top: 0.5rem;
        }

        /* Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            cursor: zoom-out;
        }
        #lightbox.open { display: flex; }
        #lightbox img {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 8px;
            box-shadow: 0 0 60px rgba(0,0,0,0.8);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-mid);
        }
        .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }

        .loading-spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .logout-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-mid);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logout-btn:hover { border-color: var(--red); color: var(--red); }

        @media (max-width: 600px) {
            .proof-header { flex-direction: column; }
            .proof-thumb, .proof-file-link { width: 80px; height: 80px; }
        }

        /* Logistics Dashboard Styles */
        .logistics-container {
            margin-top: 1rem;
        }
        .logistics-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 1rem;
            border-radius: 12px;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logistics-sub-tabs {
            display: flex;
            gap: 0.5rem;
        }
        .logistics-sub-tab {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text-mid);
            font-size: 0.82rem;
            font-weight: 600;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .logistics-sub-tab:hover {
            color: var(--text-high);
            border-color: rgba(255,255,255,0.2);
        }
        .logistics-sub-tab.active {
            background: rgba(249, 115, 22, 0.15);
            border-color: #f97316;
            color: #f97316;
        }
        .logistics-buttons {
            display: flex;
            gap: 0.75rem;
        }
        .btn-orange {
            background: #f97316;
            color: #ffffff;
            border: none;
        }
        .btn-orange:hover {
            background: #ea580c;
        }
        .btn-orange:disabled {
            background: #9a3412;
            opacity: 0.6;
            cursor: not-allowed;
        }
        .logistics-table-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            width: 100%;
        }
        .logistics-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
            min-width: 800px;
        }
        .logistics-table th, .logistics-table td {
            padding: 0.85rem 1rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-high);
        }
        .logistics-table th {
            background: var(--surface2);
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            color: var(--text-mid);
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.5px;
        }
        .logistics-table tr:hover td {
            background: rgba(255,255,255,0.02);
        }
        .checkbox-custom {
            width: 18px;
            height: 18px;
            accent-color: #f97316;
            cursor: pointer;
            vertical-align: middle;
        }
        .shipped-badge {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
        }
        .badge-waiting {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f59e0b;
        }
        .badge-shipped {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: var(--green);
        }
        .search-logistics {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-high);
            padding: 0.4rem 0.8rem;
            font-size: 0.82rem;
            width: 200px;
            font-family: inherit;
        }
        .search-logistics:focus {
            border-color: #f97316;
            outline: none;
        }

        /* ── Marketing Dashboard ── */
        #section-marketing { display: none; }
        .mkt-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .mkt-tab {
            padding: 0.4rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-mid);
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mkt-tab.active {
            background: rgba(249, 115, 22, 0.15);
            border-color: rgba(249, 115, 22, 0.5);
            color: var(--accent);
        }
        .mkt-tab:hover:not(.active) { border-color: rgba(255,255,255,0.2); color: var(--text-high); }
        .kpi-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem 1.75rem;
            margin-bottom: 1.25rem;
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s;
        }
        .kpi-card.status-good  { border-color: rgba(34, 197, 94, 0.35); }
        .kpi-card.status-warn  { border-color: rgba(245, 158, 11, 0.35); }
        .kpi-card.status-crit  { border-color: rgba(239, 68, 68, 0.35); }
        .kpi-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }
        .kpi-card-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-high);
        }
        .kpi-status-badge {
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
        }
        .badge-good  { background: rgba(34,197,94,0.12);  color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
        .badge-warn  { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
        .badge-crit  { background: rgba(239,68,68,0.12);  color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
        .badge-neu   { background: rgba(255,255,255,0.06); color: var(--text-mid); border: 1px solid var(--border); }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 1rem;
            margin-bottom: 1.25rem;
        }
        .kpi-item {}
        .kpi-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-mid);
            margin-bottom: 0.25rem;
        }
        .kpi-value {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-high);
        }
        .kpi-sub {
            font-size: 0.78rem;
            color: var(--text-mid);
            margin-top: 0.15rem;
        }
        .kpi-bar-row {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .kpi-bar-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.78rem;
            color: var(--text-mid);
        }
        .kpi-bar-track {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.07);
            border-radius: 4px;
            overflow: hidden;
        }
        .kpi-bar-fill {
            height: 100%;
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        .kpi-bar-fill.green { background: #22c55e; }
        .kpi-bar-fill.yellow { background: #f59e0b; }
        .kpi-bar-fill.red { background: #ef4444; }
        .kpi-bar-val { min-width: 60px; text-align: right; color: var(--text-high); font-weight: 600; }
        #mkt-loading { color: var(--text-mid); font-size: 0.9rem; text-align: center; padding: 3rem; }
        .mkt-no-data { color: var(--text-mid); text-align: center; padding: 3rem; }
        .mkt-last-updated { font-size: 0.72rem; color: var(--text-low); text-align: right; margin-bottom: 0.5rem; }

        /* P&L + Cashflow */
        .fin-section {
            margin-top: 1.25rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }
        .fin-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-mid);
            margin-bottom: 0.65rem;
            font-weight: 700;
        }
        .fin-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            padding: 0.22rem 0;
            color: var(--text-mid);
        }
        .fin-row.total {
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 0.35rem;
            padding-top: 0.5rem;
            font-weight: 700;
            color: var(--text-high);
            font-size: 0.9rem;
        }
        .fin-plus  { color: #22c55e; font-weight: 600; }
        .fin-minus { color: var(--text-mid); }
        .fin-profit-pos { color: #22c55e; font-weight: 800; font-size: 1rem; }
        .fin-profit-neg { color: #ef4444; font-weight: 800; font-size: 1rem; }
        .fin-two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0 1.5rem;
        }
        @media (max-width: 600px) {
            .fin-two-col { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">VITA<span>STEPS</span></div>
    <div class="admin-label">🔐 Admin Panel</div>

    <!-- LOGIN SCREEN -->
    <div id="screen-login">
        <div class="card">
            <h2>Adminisztrátori Belépés</h2>
            <p style="color: var(--text-mid); font-size: 0.9rem; margin-bottom: 1.25rem;">
                Ez az oldal kizárólag VitaSteps adminisztrátorok számára érhető el.
            </p>
            <input type="password" id="admin-password" class="input-text" placeholder="Admin jelszó" onkeydown="if(event.key==='Enter') doLogin()">
            <button class="btn btn-primary" onclick="doLogin()">
                <span id="login-btn-text">Belépés</span>
            </button>
            <p id="login-error" style="color: var(--red); font-size: 0.85rem; margin-top: 0.75rem; display: none;">
                ❌ Hibás jelszó. Próbáld újra.
            </p>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="screen-dashboard">
        <div class="dashboard-header">
            <div>
                <div style="font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem;">
                    Beküldött Teljesítések
                </div>
                <div class="stats-bar" id="stats-bar">
                    <div class="stat-chip">Betöltés... <span class="loading-spinner" style="width:14px;height:14px;border-width:2px;vertical-align:middle;"></span></div>
                </div>
            </div>
            <div style="display: flex; gap: 0.75rem; align-items: center;">
                <button class="logout-btn" style="border-color: rgba(34, 197, 94, 0.3); color: #22c55e;" onclick="triggerRefresh(this)">
                    🔄 Frissítés
                </button>
                <button class="logout-btn" onclick="doLogout()">Kijelentkezés</button>
            </div>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" onclick="setFilter('pending')" id="tab-pending">⏳ Várakozó</button>
            <button class="filter-tab" onclick="setFilter('approved')" id="tab-approved">✅ Jóváhagyott</button>
            <button class="filter-tab" onclick="setFilter('all')" id="tab-all">📋 Összes</button>
            <button class="filter-tab" onclick="setFilter('predikalo')" id="tab-predikalo" style="border: 1px solid rgba(99,179,237,0.4); color: #63b3ed;">🏔️ Prédikálószék</button>
            <button class="filter-tab" onclick="setFilter('logistics')" id="tab-logistics" style="margin-left: auto; border: 1px solid rgba(249, 115, 22, 0.3); color: #f97316;">🦊 Logisztika (Foxpost)</button>
            <button class="filter-tab" onclick="setFilter('marketing')" id="tab-marketing" style="border: 1px solid rgba(196, 255, 0, 0.3); color: #c4ff00;">📊 Marketing</button>
        </div>

        <div id="proof-list">
            <div class="empty-state">
                <div class="icon">⏳</div>
                <div>Adatok betöltése...</div>
            </div>
        </div>

        <!-- MARKETING DASHBOARD -->
        <div id="section-marketing">
            <div class="mkt-tabs">
                <button class="mkt-tab active" onclick="setMktRange('1d')" id="mkt-tab-1d">📅 Ma / Tegnap</button>

    function getShipment(run) {
        if (!run) return {};
        if (Array.isArray(run.shipments)) {
            return run.shipments[0] || {};
        }
        return run.shipments || {};
    }

    function getGroupedRunIds(targetRun) {
        if (!targetRun || !targetRun.completed) return [targetRun.id];
        const groupRunIds = [targetRun.id];
        const targetEmail = (targetRun.runners?.email || '').toLowerCase().trim();
        const targetShipTogether = (targetRun.ship_together_with || '').toLowerCase().trim();
        const targetShipment = getShipment(targetRun);
        const targetDest = targetShipment.parcel_id || targetRun.parcel_id || '';
        const targetCampaign = targetRun.campaign || 'predikaloszek';

        allRuns.forEach(run => {
            if (run.id === targetRun.id || !run.completed) return;

            // Must belong to the exact same campaign
            const runCampaign = run.campaign || 'predikaloszek';
            if (runCampaign !== targetCampaign) return;

            const shipment = getShipment(run);
            const isShipped = !!shipment.shipped;
            if (isShipped) return; // Skip already shipped

            const method = shipment.method || run.shipping_method || 'foxpost';
            if (method !== 'foxpost') return; // Only group foxpost locker shipments

            const dest = shipment.parcel_id || run.parcel_id || '';
            if (dest !== targetDest || !dest) return; // Lockers must match

            const email = (run.runners?.email || '').toLowerCase().trim();
            const shipTogether = (run.ship_together_with || '').toLowerCase().trim();

            const isMatch = (
                email === targetEmail ||
                (targetShipTogether && targetShipTogether === email) ||
                (shipTogether && shipTogether === targetEmail) ||
                (targetShipTogether && shipTogether && targetShipTogether === shipTogether)
            );

            if (isMatch) {
                groupRunIds.push(run.id);
            }
        });

        return Array.from(new Set(groupRunIds));
    }

    function aggregateMetrics(rows) {
        const byName = {};
        for (const r of rows) {
            const k = r.campaign_name || r.campaign_id;
            if (!byName[k]) byName[k] = {
                campaign_id: r.campaign_id, campaign_name: r.campaign_name,
                spend: 0, impressions: 0, reach: 0, clicks: 0, link_clicks: 0,
                purchases: 0, revenue: 0, ctr_sum: 0, cpm_sum: 0, cpc_sum: 0, count: 0
            };
            const a = byName[k];
            a.spend       += Number(r.spend       || 0);
            a.impressions += Number(r.impressions || 0);
            a.reach       += Number(r.reach       || 0);
            a.clicks      += Number(r.clicks      || 0);
            a.link_clicks += Number(r.link_clicks || 0);
            a.purchases   += Number(r.purchases   || 0);
            a.revenue     += Number(r.revenue     || 0);
            a.ctr_sum     += Number(r.ctr         || 0);
            a.cpm_sum     += Number(r.cpm         || 0);
            a.cpc_sum     += Number(r.cpc         || 0);
            a.count++;
        }
        return Object.values(byName).map(a => ({
            ...a,
            ctr:  a.count > 0 ? a.ctr_sum / a.count : 0,
            cpm:  a.count > 0 ? a.cpm_sum / a.count : 0,
            cpc:  a.count > 0 ? a.cpc_sum / a.count : 0,
            cpa:  a.purchases > 0 ? a.spend / a.purchases : 0,
            roas: a.spend > 0 ? a.revenue / a.spend : 0,
        }));
    }

    function statusBadge(cpa, roas, target) {
        if (!target || !target.target_cpa) return { label: '⬜ Nincs cél', cls: 'badge-neu', card: '' };
        const isCrit = (target.critical_cpa && cpa >= target.critical_cpa)
                    || (target.critical_roas && roas <= target.critical_roas && roas > 0);
        const isGood = (target.target_cpa  && cpa < target.target_cpa)
                    && (target.target_roas  && roas >= target.target_roas);
        const isWarn = (target.warning_cpa && cpa >= target.warning_cpa)
                    || (target.warning_roas && roas <= target.warning_roas && roas > 0);
        if (isCrit) return { label: '🔴 Kritikus', cls: 'badge-crit', card: 'status-crit' };
        if (isGood) return { label: '🟢 Jó',       cls: 'badge-good', card: 'status-good' };
        if (isWarn) return { label: '🟡 Figyelem',  cls: 'badge-warn', card: 'status-warn' };
        return { label: '⚪ Semleges', cls: 'badge-neu', card: '' };
    }

    function barColor(val, good, warn) {
        // For CPA: lower is better
        if (val <= good) return 'green';
        if (val <= warn) return 'yellow';
        return 'red';
    }

    function barPct(val, max) {
        return Math.min(100, max > 0 ? (val / max) * 100 : 0).toFixed(1);

    function fmt(n, unit = 'Ft') {
        if (!n && n !== 0) return '–';
        return Number(n).toLocaleString('hu-HU', { maximumFractionDigits: 0 }) + ' ' + unit;
    }

    function analyzeCustomerCohorts(orders, fromDate) {
        const runnerCampaigns = new Map();
        const orderCohort = new Map();

        for (const o of orders) {
            const runnerId = o.runner_id;
            const campaign = (o.campaign || 'unknown').toLowerCase().trim();

            if (!runnerCampaigns.has(runnerId)) {
                runnerCampaigns.set(runnerId, new Set([campaign]));
                orderCohort.set(o.id, 'new');
            } else {
                const prevCamps = runnerCampaigns.get(runnerId);
                if (!prevCamps.has(campaign)) {
                    orderCohort.set(o.id, 'returning');
                    prevCamps.add(campaign);
                } else {
                    orderCohort.set(o.id, 'repeat');
                }
            }
        }

        const filtered = fromDate
            ? orders.filter(o => new Date(o.created_at) >= fromDate)
            : orders;

        let totalNew = 0;
        let totalReturning = 0;
        const byCamp = {};

        for (const o of filtered) {
            const cohort = orderCohort.get(o.id) || 'new';
            const camp = (o.campaign || 'unknown').toLowerCase().trim();
            if (!byCamp[camp]) byCamp[camp] = { newCount: 0, returningCount: 0, total: 0 };

            if (cohort === 'new') {
                totalNew++;
                byCamp[camp].newCount++;
            } else {
                totalReturning++;
                byCamp[camp].returningCount++;
            }
            byCamp[camp].total++;
        }

        return {
            totalNew,
            totalReturning,
            totalOrders: filtered.length,
            byCamp
        };
    }

            const stripeFees    = Math.round(revenue * STRIPE_PCT + STRIPE_FIXED * purchases);
            const medalCosts    = Math.round(purchases * medalUnitCost);
            const shippingCosts = Math.round(purchases * shippingUnitCost);

            // Gross Profit (beleértve az éremgyártási költséget is)
            const grossProfit   = Math.round(revenue - stripeFees - medalCosts - shippingCosts - spendVat);
            const marginPct     = revenue > 0 ? (grossProfit / revenue * 100).toFixed(1) : 0;

            // Nettó fedezet (az éremgyártás előtti árrés a 163 000 Ft törlesztésére)
            const netContrib    = Math.round(revenue - stripeFees - shippingCosts - spendVat);

            // Campaign Cohort calculation

                            </div>
                            <div class="fin-row total">
                                <span>Nettó Profit</span>
                                <span class="${profitCls}">${profitSign}${fmt(grossProfit)}<small style="font-size:0.7rem;opacity:0.7"> (${marginPct}%)</small></span>

                        <!-- Megtérülési árrés -->

    function updateStats() {
        const pending = allRuns.filter(r => r.proof_submitted && !r.completed).length;
        const approved = allRuns.filter(r => r.completed).length;
        const total = allRuns.length;

        document.getElementById('stats-bar').innerHTML = `
            <div class="stat-chip">⏳ Várakozó: <strong>${pending}</strong></div>
            <div class="stat-chip">✅ Jóváhagyott: <strong>${approved}</strong></div>
            <div class="stat-chip">📋 Összes: <strong>${total}</strong></div>
        `;
    }

    function isPredikaloRun(run) {
        const serial = run.serial_number || '';
        return !serial.includes('PK') && !serial.includes('999');
    }

    async function approvePredikaloRun(runId, btn) {
        if (!confirm('Biztosan jóváhagyod ezt a Prédikálószék teljesítést?')) return;
        btn.disabled = true;
        btn.textContent = '⏳ Folyamatban...';
        try {
            const res = await fetch('/api/admin-approve', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'approve', run_id: runId, admin_secret: adminSecret })
            });
            const json = await res.json();
            if (!res.ok) throw new Error(json.error || 'Ismeretlen hiba');
            btn.textContent = '✅ Jóváhagyva';
            btn.style.background = 'rgba(34,197,94,0.2)';
            btn.style.color = '#22c55e';
            btn.style.borderColor = '#22c55e';
            await loadData();
        } catch (err) {
            btn.disabled = false;
            btn.textContent = '✅ Jóváhagyás';
            alert('Hiba: ' + err.message);
        }
    }

    function setFilter(filter) {
        currentFilter = filter;
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${filter}`).classList.add('active');

        const isMkt = filter === 'marketing';
        document.getElementById('proof-list').style.display   = isMkt ? 'none' : '';
        document.getElementById('section-marketing').style.display = isMkt ? 'block' : 'none';

        if (!isMkt) renderList();
    }

            } else {
                notApproved.forEach(run => {
                    const email = run.runners?.email || '–';
                    const name  = run.name || run.runners?.name || 'Ismeretlen';
                    const serial = run.serial_number || '–';
                    html += `
                    <div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:1rem 1.25rem;margin-bottom:0.75rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.75rem;">
                        <div>
                            <div style="font-weight:700;font-size:0.95rem;">${name} <span style="color:#63b3ed;font-size:0.8rem;font-weight:600;">${serial}</span></div>

                            onclick="approvePredikaloRun('${run.id}', this)"

        if (currentFilter === 'logistics') {

            if (logisticsHideTest) completedRuns = completedRuns.filter(r => !isTestRun(r));

            // Filter by sub-filter
            let filtered = completedRuns.filter(run => {
                const shipment = getShipment(run);
                const isShipped = !!shipment.shipped;
                if (logisticsSubFilter === 'pending') return !isShipped;
                if (logisticsSubFilter === 'shipped') return isShipped;
                return true; // 'all'
            });

            // Filter by search query
            if (logisticsSearch) {
                filtered = filtered.filter(run => {
                    const runner = run.runners || {};
                    const name = (run.name || runner.name || '').toLowerCase();
                    const email = (runner.email || '').toLowerCase();
                    const serial = (run.serial_number || '').toLowerCase();
                    return name.includes(logisticsSearch) || email.includes(logisticsSearch) || serial.includes(logisticsSearch);

            if (completedRuns.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📦</div>

                return;

            const totalWaiting = completedRuns.filter(r => !getShipment(r).shipped).length;
            const totalShipped = completedRuns.filter(r => getShipment(r).shipped).length;

            // Compute consolidated Packing List
            const unshippedCompleted = completedRuns.filter(r => !getShipment(r).shipped);
            const packingGroups = [];
            const processedRunIds = new Set();

            unshippedCompleted.forEach(run => {
                if (processedRunIds.has(run.id)) return;
                const groupRunIds = getGroupedRunIds(run);
                const groupRuns = groupRunIds.map(id => allRuns.find(r => r.id === id)).filter(Boolean);
                groupRunIds.forEach(id => processedRunIds.add(id));
                packingGroups.push(groupRuns);
            });

            let packingRowsHtml = packingGroups.map(group => {

                const primaryName = primary.name || primary.runners?.name || 'Ismeretlen';

                const othersText = others.length > 0 ? ` (+ ${others.join(', ')})` : '';
                const shipment = getShipment(primary);

                let destText = '';

                    destText = `🦊 Foxpost: ${shipment.parcel_name || 'Locker'}`;

                            ${group.length} db érem
                        </div>
                    </div>
                `;
            }).join('');

            if (packingGroups.length === 0) {
                packingRowsHtml = '<div style="color: var(--text-mid); font-size: 0.85rem; padding: 0.5rem 0;">Nincsenek postázásra váró érmek.</div>';
            }

            let tableRowsHtml = filtered.map(run => {
                const runner = run.runners || {};
                const name = run.name || runner.name || 'Ismeretlen';
                const email = runner.email || '–';
                const shipment = getShipment(run);
                const phone = shipment.phone || runner.phone || '–';
                const serial = run.serial_number || '–';
                const method = shipment.method || 'foxpost';
                
                let details = '–';
                if (method === 'foxpost') {
                    details = `🦊 ${shipment.parcel_name || 'Foxpost automata'} (${shipment.parcel_id || 'ID nélkül'})${shipment.tracking_code ? '<br>📦 Csomagszám: <b>' + shipment.tracking_code + '</b>' : ''}`;
                } else if (method === 'home') {
                    details = `🏠 Házhoz: ${shipment.home_address || 'Cím nélkül'}`;
                }

                const statusText = shipment.shipped
                    ? '<span class="shipped-badge badge-shipped">Feladva</span>'
                    : '<span class="shipped-badge badge-waiting">Szállításra vár</span>';

                const groupRunIds = getGroupedRunIds(run);
                const groupBadge = groupRunIds.length > 1
                    ? `<span class="shipped-badge" style="background: #a855f7; color: #fff; margin-left: 0.5rem; font-size: 0.65rem; padding: 0.1rem 0.35rem; border-radius: 4px; display: inline-flex; align-items: center;" title="Együtt teljesítve, egy csomagban szállítva">🔗 csoport (${groupRunIds.length} db)</span>`

    let logisticsSubFilter = 'pending';
    let logisticsSearch = '';
    let logisticsHideTest = true; // teszt userek alapból rejtve

    function isTestRun(run) {
        const serial = (run.serial_number || '').toUpperCase();
        const email  = (run.runners?.email || '').toLowerCase();
        return serial.includes('TEST') || email.includes('admex');
    }

    function toggleHideTest(el) {
        logisticsHideTest = el.checked;
        renderList();
    }

    function setLogisticsSubFilter(sub) {
        logisticsSubFilter = sub;
        renderList();
    }

    function handleLogisticsSearch(e) {
        logisticsSearch = e.target.value.toLowerCase();
        renderList();
    }

    function toggleAllLogistics(masterCheckbox) {
        const checkboxes = document.querySelectorAll('.logistics-checkbox');
        checkboxes.forEach(cb => {
            cb.checked = masterCheckbox.checked;
        });
        updateLogisticsButtonsState();
    }

    function updateLogisticsButtonsState() {
        const checkedCount = document.querySelectorAll('.logistics-checkbox:checked').length;
        const btnSubmit = document.getElementById('btn-submit-foxpost');
        if (btnSubmit) {
            btnSubmit.disabled = checkedCount === 0 || logisticsSubFilter === 'shipped';
        }
        const btnShip = document.getElementById('btn-mark-shipped');
        if (btnShip) {
            btnShip.disabled = checkedCount === 0 || logisticsSubFilter === 'shipped';
        }
    }

    function getSelectedRuns() {
        const checkedBoxes = document.querySelectorAll('.logistics-checkbox:checked');
        const ids = Array.from(checkedBoxes).map(cb => cb.dataset.runId);
        return allRuns.filter(r => ids.includes(r.id));
    }

    function formatPhone(phone) {
        if (!phone) return '';
        let cleaned = phone.replace(/\D/g, '');
        if (cleaned.startsWith('06')) {
            cleaned = '36' + cleaned.substring(2);
        }
        if (!cleaned.startsWith('36') && cleaned.length === 9) {
            cleaned = '36' + cleaned;
        }
        return `+${cleaned}`;
    }

    function parseAddress(addr) {
        if (!addr) return { zip: '', city: '', street: '' };
        const match = addr.match(/^(\d{4})[,\s]+([A-Za-záéíóöőúüűÁÉÍÓÖŐÚÜŰ\s\-]+?)[,\s]+(.*)$/);
        if (match) {
            return {
                zip: match[1],
                city: match[2].trim(),
                street: match[3].trim()
            };
        }
        return { zip: '', city: '', street: addr };
    }

    async function triggerSubmitFoxpost(btn) {
        const runs = getSelectedRuns();
        if (runs.length === 0) return;

        // Filter runs to only include Foxpost locker deliveries that are not shipped yet
        const eligibleRuns = runs.filter(run => {
            const shipment = getShipment(run);
            return (shipment.method || 'foxpost') === 'foxpost' && !shipment.shipped;
        });

        if (eligibleRuns.length === 0) {
            alert('A kijelöltek között nincs érvényes (még fel nem adott) Foxpost automatás szállítás.');
            return;
        }

        if (!confirm(`Biztosan feladsz ${eligibleRuns.length} db csomagot közvetlenül a Foxpost API-n keresztül?`)) return;

        btn.disabled = true;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="loading-spinner"></span>';

        const runIds = eligibleRuns.map(r => r.id);

        const res = await fetch('/api/create-foxpost-parcels', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ run_ids: runIds, admin_secret: adminSecret })
        });

        const resData = await res.json();

        if (res.ok) {
            let msg = '';
            if (resData.created_count > 0) {
                msg += `Sikeres beküldés! ${resData.created_count} db csomag sikeresen létrejött a Foxpostban és szinkronizálva lett a Supabase-be.`;
            } else {
                msg += 'Egyetlen csomagnál sem sikerült generálni a vonalkódot a Foxpostnál.';
            }

            if (resData.failed && resData.failed.length > 0) {
                msg += '\n\nAz alábbi csomagok beküldése sikertelen volt (ellenőrizd a címet/telefont!):\n';
                resData.failed.forEach(f => {
                    const errMsgs = f.errors.map(e => `${e.field || ''}: ${e.message}`).join(', ');
                    msg += `- ${f.serial_number} (${f.recipient || 'Ismeretlen'}): ${errMsgs}\n`;
                });
            }
            alert(msg);
            loadData();
        } else {
            alert('Hiba a beküldés során: ' + (resData.error || 'Ismeretlen hiba'));
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    async function triggerMarkShipped(btn) {
        const runs = getSelectedRuns();
        if (runs.length === 0) return;

        if (!confirm(`Biztosan feladottnak jelölsz ${runs.length} db csomagot?`)) return;

        btn.disabled = true;
        const originalText = btn.innerHTML;
        btn.innerHTML = '<span class="loading-spinner"></span>';

        const runIds = runs.map(r => r.id);

        const res = await fetch('/api/admin-approve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'ship', run_ids: runIds, admin_secret: adminSecret })
        });

        const resData = await res.json();

        if (res.ok) {
            // Update local runs
            runIds.forEach(id => {
                const idx = allRuns.findIndex(r => r.id === id);
                if (idx !== -1) {
                    if (!allRuns[idx].shipments) {
                        allRuns[idx].shipments = {};
                    }
                    if (Array.isArray(allRuns[idx].shipments)) {
                        if (allRuns[idx].shipments.length === 0) allRuns[idx].shipments.push({});
                        allRuns[idx].shipments[0].shipped = true;
                        allRuns[idx].shipments[0].shipped_at = new Date().toISOString();
                    } else {
                        allRuns[idx].shipments.shipped = true;
                        allRuns[idx].shipments.shipped_at = new Date().toISOString();
                    }
                    allRuns[idx].shipped = true;
                }
            });
            updateStats();
            renderList();
        } else {
            alert('Hiba: ' + (resData.error || 'Ismeretlen hiba'));
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }

    function buildCard(run) {
        const runner = run.runners || {};
        const name = run.name || runner.name || 'Ismeretlen';
        const email = runner.email || '–';
        const serial = run.serial_number || '–';
        const submittedAt = run.proof_submitted_at
            ? new Date(run.proof_submitted_at).toLocaleString('hu-HU', { dateStyle: 'short', timeStyle: 'short' })
            : '–';
        const completionDate = run.completion_date || '–';

        const statusBadge = run.completed
            ? `<span class="badge badge-approved">✅ Jóváhagyva${completionDate !== '–' ? ' · ' + completionDate : ''}</span>`
            : `<span class="badge badge-pending">⏳ Várakozó</span>`;

        const filesHtml = buildFileGrid(run.proof_urls || []);

        const actionsHtml = run.completed
            ? `<div class="action-result">✅ Jóváhagyva – ${completionDate}</div>`
            : `
                <button class="btn btn-approve" onclick="doAction('approve', '${run.id}', this)">
                    ✓ Jóváhagyás
                </button>
                <button class="btn btn-reject" onclick="doAction('reject', '${run.id}', this)">
                    ✕ Elutasítás
                </button>
            `;

        return `
        <div class="proof-card ${run.completed ? 'approved' : ''}" id="card-${run.id}">
            <div class="proof-header">
                <div>
                    <div class="runner-name">${name}</div>
                    <div class="runner-meta">
                        📧 ${email}<br>
                        📅 Beküldve: ${submittedAt}
                    </div>
                </div>
                <div class="badges">
                    <span class="badge badge-serial">${serial}</span>
                    ${statusBadge}
                </div>
            </div>

            <div class="proof-files">${filesHtml}</div>

            <div class="proof-actions">${actionsHtml}</div>
        </div>`;
    }

    function buildFileGrid(urls) {
        if (!urls || urls.length === 0) {
            return `<div style="color: var(--text-low); font-size: 0.85rem; padding: 0.5rem 0;">Nincs csatolt fájl.</div>`;
        }

        return urls.map(url => {
            const filename = url.split('/').pop().split('?')[0];
            const ext = filename.split('.').pop().toLowerCase();
            const isImage = ['jpg', 'jpeg', 'png', 'webp', 'heic'].includes(ext);
            const isGpx = ['gpx', 'fit', 'tcx'].includes(ext);

            if (isImage) {
                return `
                    <div class="proof-thumb" onclick="openLightbox('${url}')" title="${filename}">
                        <img src="${url}" alt="${filename}" loading="lazy" onerror="this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-size:1.5rem;\\'>📷</div>'">
                    </div>`;
            } else if (isGpx) {
                return `
                    <a href="${url}" download="${filename}" target="_blank" class="proof-file-link" title="${filename}">
                        <span class="file-icon">🗺️</span>
                        <span>${ext.toUpperCase()}</span>
                    </a>`;
            } else {
                return `
                    <a href="${url}" download="${filename}" target="_blank" class="proof-file-link" title="${filename}">
                        <span class="file-icon">📄</span>
                        <span>${filename.substring(0, 12)}...</span>
                    </a>`;
            }
        }).join('');
    }

    // ─── Actions ─────────────────────────────────────────────
    async function doAction(action, runId, btn) {
        const card = document.getElementById(`card-${runId}`);
        const allBtns = card.querySelectorAll('.btn');
        allBtns.forEach(b => { b.disabled = true; });
        btn.innerHTML = '<span class="loading-spinner"></span>';

        const res = await fetch('/api/admin-approve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action, run_id: runId, admin_secret: adminSecret })
        });

        const data = await res.json();

        if (res.ok) {
            // Update local state
            const idx = allRuns.findIndex(r => r.id === runId);
            if (idx !== -1) {
                if (action === 'approve') {
                    allRuns[idx].completed = true;
                    allRuns[idx].completion_date = new Date().toISOString().split('T')[0];
                } else {
                    allRuns[idx].proof_submitted = false;
                    allRuns[idx].proof_urls = [];
                }
            }
            updateStats();
            renderList();
        } else {
            alert('Hiba: ' + (data.error || 'Ismeretlen hiba'));
            allBtns.forEach(b => { b.disabled = false; });
            btn.innerHTML = action === 'approve' ? '✓ Jóváhagyás' : '✕ Elutasítás';
        }
    }

    // ─── Lightbox ────────────────────────────────────────────
    function openLightbox(url) {
        document.getElementById('lightbox-img').src = url;
        document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('open');
    }
    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeLightbox();
    });
</script>
