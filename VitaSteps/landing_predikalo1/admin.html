<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VitaSteps – Admin Vezérlőpult</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .logistics-sub-tab {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-mid);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .logistics-sub-tab.active {
            background: rgba(249, 115, 22, 0.15);
            border-color: rgba(249, 115, 22, 0.4);
            color: var(--accent);
        }
        .mkt-tab {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-mid);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .mkt-tab.active {
            background: rgba(196, 255, 0, 0.12);
            border-color: rgba(196, 255, 0, 0.4);
            color: #c4ff00;
        }
        .fin-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .fin-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .fin-card.highlight {
            border-color: rgba(56, 189, 248, 0.4);
            background: linear-gradient(145deg, rgba(56, 189, 248, 0.08) 0%, rgba(12, 15, 21, 0.95) 100%);
        }
        .fin-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .fin-badge-revolut { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
        .fin-badge-stripe { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }

        /* CASHFLOW TIMELINE STYLES */
        .timeline-section {
            margin-top: 2rem;
            background: var(--surface);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }
        .timeline-section::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #38bdf8 0%, #22c55e 50%, #c4ff00 100%);
        }
        .timeline-kpi-bar {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 0.75rem;
            margin: 1.25rem 0;
        }
        .timeline-kpi-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
        }
        .timeline-kpi-label {
            font-size: 0.72rem;
            color: var(--text-mid);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 700;
        }
        .timeline-kpi-val {
            font-size: 1.25rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            margin-top: 0.2rem;
        }
        .timeline-chart-box {
            background: #07090e;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.25rem;
            position: relative;
        }
        .timeline-tooltip {
            position: absolute;
            display: none;
            background: rgba(12, 15, 21, 0.95);
            border: 1px solid #38bdf8;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            border-radius: 8px;
            padding: 0.6rem 0.9rem;
            font-size: 0.8rem;
            pointer-events: none;
            z-index: 100;
            white-space: nowrap;
            transform: translate(-50%, -115%);
            transition: opacity 0.15s ease;
        }
        .timeline-sub-tab {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-mid);
            font-size: 0.78rem;
            font-weight: 600;
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .timeline-sub-tab.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: rgba(56, 189, 248, 0.5);
            color: #38bdf8;
        }
        .timeline-day-row {
            cursor: pointer;
            transition: background 0.15s;
        }
        .timeline-day-row:hover {
            background: rgba(56, 189, 248, 0.04) !important;
        }
        .timeline-details-box {
            background: rgba(7, 9, 14, 0.85);
            border-left: 3px solid #38bdf8;
            padding: 0.75rem 1rem;
            margin: 0.4rem 0;
            border-radius: 0 8px 8px 0;
            font-size: 0.82rem;
        }
        .cf-dot {
            transition: r 0.15s, stroke-width 0.15s;
            cursor: pointer;
        }
        .cf-dot:hover {
            r: 7 !important;
            stroke-width: 3 !important;
            stroke: #fff !important;
        }
        .asset-dot {
            transition: r 0.15s, stroke-width 0.15s;
            cursor: pointer;
        }
        .asset-dot:hover {
            r: 7.5 !important;
            stroke-width: 3 !important;
            stroke: #fff !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">VITA<span>STEPS</span></div>
    <div class="admin-label">Adminisztrációs Rendszer</div>

    <!-- 1. BEJELENTKEZÉS KÉPERNYŐ -->
    <div id="screen-login">
        <div class="card">
            <h2>Admin Belépés</h2>
            <input type="password" id="admin-password" class="input-text" placeholder="Admin jelszó..." onkeydown="if(event.key==='Enter') login()">
            <button class="btn btn-primary" onclick="login()">Belépés</button>
            <div id="login-error" style="color: var(--red); font-size: 0.85rem; margin-top: 1rem; display: none; text-align: center;"></div>
        </div>
    </div>

    <!-- 2. FŐ DASHBOARD KÉPERNYŐ -->
    <div id="screen-dashboard">
        <div class="dashboard-header">
            <div class="stats-bar" id="stats-bar">
                <div class="stat-chip">Betöltés...</div>
            </div>
            <div style="display: flex; gap: 0.75rem;">
                <button class="btn btn-grey" style="width: auto; padding: 0.5rem 1rem; font-size: 0.85rem;" onclick="loadData()">
                    🔄 Frissítés
                </button>
                <button class="btn btn-grey" style="width: auto; padding: 0.5rem 1rem; font-size: 0.85rem;" onclick="logout()">
                    Kijelentkezés
                </button>
            </div>
        </div>

        <!-- Éremkészlet & Kampány Inventory Tracker -->
        <div id="inventory-bar" style="margin-bottom: 1.75rem;"></div>

        <!-- Fő Navigációs Fülek -->
        <div class="filter-tabs">
            <button class="filter-tab active" onclick="setFilter('pending')" id="tab-pending">⏳ Várakozó</button>
            <button class="filter-tab" onclick="setFilter('approved')" id="tab-approved">✅ Jóváhagyott</button>
            <button class="filter-tab" onclick="setFilter('all')" id="tab-all">📋 Összes</button>
            <button class="filter-tab" onclick="setFilter('logistics')" id="tab-logistics" style="margin-left: auto; border: 1px solid rgba(249, 115, 22, 0.4); color: #f97316;">🦊 Logisztika & Csomagolás</button>
            <button class="filter-tab" onclick="setFilter('marketing')" id="tab-marketing" style="border: 1px solid rgba(196, 255, 0, 0.4); color: #c4ff00;">📊 Marketing</button>
            <button class="filter-tab" onclick="setFilter('finance')" id="tab-finance" style="border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8;">💳 Pénzügy & Cashflow</button>
        </div>

        <!-- Lista és Logisztika Konténer -->
        <div id="proof-list">
            <div class="empty-state">
                <div class="icon">⏳</div>
                <div>Adatok betöltése...</div>
            </div>
        </div>

        <!-- MARKETING MODUL SCREEN -->
        <div id="section-marketing" style="display: none;">
            <div style="margin-bottom: 0.85rem;">
                <div style="font-size: 0.72rem; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; font-weight: 700;">
                    🏔️ Kihívás kiválasztása:
                </div>
                <div class="filter-tabs" id="mkt-campaign-tabs" style="border: none; margin-bottom: 0.5rem;">
                    <button class="mkt-tab active" onclick="setMktCampaign('pilis')" id="mkt-camp-pilis">⭐ Nagy-Kevély</button>
                    <button class="mkt-tab" onclick="setMktCampaign('predikalo')" id="mkt-camp-predikalo">🏔️ Prédikálószék</button>
                    <button class="mkt-tab" onclick="setMktCampaign('all')" id="mkt-camp-all">♾️ Összesített (Mindkét kihívás)</button>
                </div>
            </div>

            <div style="margin-bottom: 1.25rem;">
                <div style="font-size: 0.72rem; color: var(--text-mid); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.4rem; font-weight: 700;">
                    📅 Időablak:
                </div>
                <div class="filter-tabs" id="mkt-time-tabs" style="border: none; margin-bottom: 0.5rem;">
                    <button class="mkt-tab" onclick="setMktRange('1d')" id="mkt-tab-1d">📅 Ma / Tegnap</button>
                    <button class="mkt-tab" onclick="setMktRange('3d')" id="mkt-tab-3d">📈 3 nap</button>
                    <button class="mkt-tab" onclick="setMktRange('7d')" id="mkt-tab-7d">🗓️ 7 nap</button>
                    <button class="mkt-tab active" onclick="setMktRange('all')" id="mkt-tab-all">♾️ Összesített időszak</button>
                </div>
            </div>

            <div id="mkt-last-updated" style="font-size: 0.75rem; color: var(--text-mid); margin-bottom: 1rem;"></div>
            <div id="mkt-cards">
                <div class="empty-state"><span class="loading-spinner"></span><div style="margin-top:0.5rem">Marketing adatok betöltése...</div></div>
            </div>
        </div>

        <!-- PÉNZÜGY & CASHFLOW MODUL SCREEN -->
        <div id="section-finance" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.25rem; flex-wrap: wrap; gap: 0.75rem;">
                <div>
                    <h2 style="font-size: 1.25rem; font-weight: 800; color: #fff; margin: 0;">💳 Pénzügyi Egyenleg & Cashflow Főkönyv</h2>
                    <div style="font-size: 0.8rem; color: var(--text-mid); margin-top: 0.2rem;">Élő Stripe egyenlegek és Revolut Pro bankszámla tranzakciók a kezdetektől.</div>
                </div>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <input type="file" id="revolut-file-input" accept=".csv" style="display: none;" onchange="handleRevolutFileSelect(event)">
                    <button class="btn btn-purple" style="width: auto; padding: 0.45rem 0.85rem; font-size: 0.82rem;" onclick="document.getElementById('revolut-file-input').click()">
                        📥 Új Revolut CSV Feltöltése
                    </button>
                    <button class="btn btn-grey" style="width: auto; padding: 0.45rem 0.85rem; font-size: 0.82rem;" onclick="loadFinance()">
                        🔄 Frissítés
                    </button>
                </div>
            </div>

            <div id="fin-cards">
                <div class="empty-state"><span class="loading-spinner"></span><div style="margin-top:0.5rem">Pénzügyi adatok betöltése...</div></div>
            </div>
        </div>
    </div>
</div>

<!-- Image Zoom Lightbox Modal -->
<div id="image-modal" class="modal-backdrop" onclick="closeImageModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeImageModal()">✕</button>
        <img id="modal-img" src="" alt="Igazolás teljes méretben">
    </div>
</div>

<!-- Modular Scripts -->
<script src="js/admin-core.js"></script>
<script src="js/admin-proofs.js"></script>
<script src="js/admin-logistics.js"></script>
<script src="js/admin-marketing.js"></script>
<script src="js/admin-finance.js"></script>

</body>
</html>
