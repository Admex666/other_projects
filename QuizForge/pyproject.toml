[project]
name = "quizforge"
version = "0.1.0"
description = "Többfelhasználós, adatvezérelt kvízfelkészítő platform knowledge graph és confidence calibration alapokon"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "duckdb>=1.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "beautifulsoup4>=4.12.0",
    "groq>=0.9.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
