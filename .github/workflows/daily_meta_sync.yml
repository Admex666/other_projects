name: Daily Meta Ads Sync

on:
  schedule:
    # 22:25 CEST (UTC+2) = 20:25 UTC
    - cron: '25 20 * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install python-dotenv

      - name: Run daily Meta sync
        env:
          META_ACCESS_TOKEN:         ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID:        ${{ secrets.META_AD_ACCOUNT_ID }}
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PUSHBULLET_ACCESS_TOKEN:   ${{ secrets.PUSHBULLET_ACCESS_TOKEN }}
        run: |
          cd VitaSteps/landing_predikalo1
          python scripts/fetch_meta_daily.py
