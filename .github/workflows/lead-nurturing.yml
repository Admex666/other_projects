name: VitaSteps Lead Nurturing Sequence

# MEGJEGYZÉS: Az automatikus időzített futtatás (schedule / cron) KIKAPCSOLVA a felhasználó kérésére!
# A workflow CSAK manuálisan (workflow_dispatch) indítható el a GitHub felületén, és
# kizárólag teszt üzeneteket küld az admexgm@gmail.com címre (valódi leadeknek NEM küld!).
#
# on:
#   schedule:
#     - cron: '0 7,10,13,16 * * *'

on:
  workflow_dispatch:
    inputs:
      test_step:
        description: 'Teszt email lépés admexgm@gmail.com-ra (0, 1, 3, 5, 7, 10 vagy all)'
        type: string
        required: false
        default: '1'
      dry_run:
        description: 'Dry run mód (csak ellenőrzés, nem küld még teszt emailt sem)'
        type: boolean
        required: false
        default: false

jobs:
  run-nurture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./VitaSteps/landing_predikalo1
        run: |
          npm ci || npm install

      - name: Run Lead Nurturing Sequence
        working-directory: ./VitaSteps/landing_predikalo1
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          INPUT_TEST_STEP: ${{ github.event.inputs.test_step }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          FLAGS="--send"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            FLAGS="--dry-run"
          fi
          if [ -n "$INPUT_TEST_STEP" ]; then
            FLAGS="$FLAGS --test-step=$INPUT_TEST_STEP"
          fi
          FLAGS="$FLAGS --force-time"

          echo "Running nurture sequence with flags: $FLAGS"
          node scripts/run_lead_nurture_sequence.js $FLAGS
